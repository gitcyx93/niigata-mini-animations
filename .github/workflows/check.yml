name: Current animation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare FFmpeg and FFprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Run tool and recording tests
        run: npm test
        env:
          NIIGATA_RECORD_INTEGRATION: '1'
      - run: npm run build:check
      - run: npm run check:motion
      - run: npm run check
