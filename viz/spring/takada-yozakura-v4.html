<script>
// 高田夜樱：20 秒，四个视角
//   1 点灯  0–4.6     小路上的纸灯笼一盏接一盏亮起来，照出头顶的花
//   2 抬头  4.6–9.2   站在树下往上看，花瓣朝镜头落下来
//   3 倒影  9.2–14.6  先看到水里倒着的三重橹，镜头再抬起来
//   4 花筏  14.6–20   从正上方看水面，花瓣顺水流成一条河
const W = 1080, H = 1920, T = 20, TAU = Math.PI * 2;
const PLAN = [{name: '点灯', t0: 0, t1: 4.6}, {name: '抬头', t0: 4.6, t1: 9.2}, {name: '倒影', t0: 9.2, t1: 14.6}, {name: '花筏', t0: 14.6, t1: 20}];
const shotAt = t => PLAN.findIndex(p => t >= p.t0 && t < p.t1);
const cv = document.getElementById('c'), g = cv.getContext('2d');

// ======== 工具 ========
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const fract = x => x - Math.floor(x);
const hash = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), fx = ease(x - xi), fy = ease(y - yi); return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), fx), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), fx), fy); }
const glowCache = {};
function glowSprite(col) {                       // 平滑的圆形光斑（逐像素算，不出现渐变的色带）
  const key = col.join(); if (glowCache[key]) return glowCache[key];

const RH = 1500;

// ======== 镜头 4：正上方看花筏 ========
const S4 = (() => {

function shot4(t) {

// ======== 文字：左上角地名、标题、旁白；中下方大字和一行补充 ========
const CJK = '"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif', LAT = '"Sora","Source Han Sans SC",sans-serif';
function chars(s, px, wt, sp) { return [...s].map(ch => { g.font = `${wt} ${px}px ${ch.charCodeAt(0) < 128 ? LAT : CJK}`; return [ch, g.font, g.measureText(ch).width + sp]; }); }

const vignette = (() => {

function render(t) {
