<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(232,238,248,.9)';       // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;
  if (sprites[key]) return sprites[key];

  const BW = W + TRAVEL * (C2 - C1) + 260;
  ART.boughs = mk(BW, 1020);
  on(ART.boughs, b => {
    for (let i = 0; i < 10; i++) bough(b, 60 + i * (BW - 120) / 9 + (rnd(i, 71) - .5) * 90, 560 + rnd(i, 72) * 380, i + 3);
    b.setTransform(1, 0, 0, 1, 0, 0); b.globalCompositeOperation = 'source-atop';                // 上面沉进夜色，下面迎着灯
    const sh = b.createLinearGradient(0, 0, 0, 1020); sh.addColorStop(0, 'rgba(12,11,42,.93)'); sh.addColorStop(.42, 'rgba(14,12,46,.62)'); sh.addColorStop(.7, 'rgba(16,13,50,.22)'); sh.addColorStop(1, 'rgba(255,208,160,.2)');
    b.fillStyle = sh; b.fillRect(0, 0, BW, 1020);
  });
  const s1 = mk(Math.round(BW / 8), 128); s1.getContext('2d').drawImage(ART.boughs, 0, 0, s1.width, 128);
  ART.boughsFar = mk(Math.round(BW / 2), 510);                                                    // 远一层：失焦、偏暗
  on(ART.boughsFar, b => { b.imageSmoothingQuality = 'high'; b.drawImage(s1, 0, 0, ART.boughsFar.width, 510); b.globalCompositeOperation = 'source-atop'; b.fillStyle = 'rgba(20,16,58,.45)'; b.fillRect(0, 0, ART.boughsFar.width, 510); });
  ART.lampBg = verticalSprite('gLamp', [[0, [8, 10, 34, 255]], [.42, [26, 19, 60, 255]], [.7, [15, 12, 42, 255]], [1, [6, 6, 20, 255]]]);
  return ART;
}

// ======== 水面：把岸上的画面一条一条翻下来，再加灯在水里拉出的光 ========
function composeWorld(t, WLv, lans, level, o) {
  on(worldC, b => {
    b.setTransform(1, 0, 0, 1, 0, 0); b.globalAlpha = 1; b.globalCompositeOperation = 'source-over';
    b.drawImage(aboveC, 0, 0, W, WLv, 0, 0, W, WLv);
    b.fillStyle = '#05071a'; b.fillRect(0, WLv, W, H - WLv);
    const SH = 3, maxD = Math.min(WLv - SH, H - WLv);
    for (let d = 0; d < maxD; d += SH) {
      const amp = Math.min(o.amp, .8 + d * .007);
      const dx = Math.sin(d * .105 - t * 2 + 1.7 * Math.sin(d * .021 + t * .6)) * amp + Math.sin(d * .31 + t * 3.1) * amp * .22;
      b.globalAlpha = lerp(o.a0, o.a1, clamp(d / 800));
      b.drawImage(aboveC, 0, WLv - d - SH, W, SH, dx - 12, WLv + d, W + 24, SH);
    }
    b.globalAlpha = o.shade; b.drawImage(ART.shade, 0, WLv, W, H - WLv);
    b.globalAlpha = 1; b.fillStyle = 'rgba(4,6,18,.5)'; b.fillRect(0, WLv, W, 3);
    b.globalCompositeOperation = 'lighter';
    lans.forEach((l, i) => {
      const k = level(l); if (k < .02) return;
      for (let j = 0; j < 30; j++) {
        const d = 5 + j * 8 + j * j * .45, w = 2.4 + j * .16, a = k * .26 * Math.pow(1 - j / 30, 1.3) * (.55 + .45 * Math.sin(t * 2.6 + j * 1.1 + i * 2.3));
        if (a <= .004) continue;
        b.fillStyle = css([255, 198, 138], a); b.fillRect(l.x - w / 2 + Math.sin(d * .15 - t * 2.2 + i) * (.6 + j * .22), WLv + d, w, 11 + j * .9);
      }
    });
    for (let i = 0; i < 90; i++) {                                 // 水面的碎光
      const d = 20 + Math.pow(rnd(i, 32), 1.5) * (H - WLv - 30);
      const a = .1 * Math.pow(Math.max(0, Math.sin(t * (.8 + rnd(i, 33)) + i * 1.9)), 3); if (a < .01) continue;
      const len = 8 + 34 * d / 800; b.fillStyle = css(o.glint, a); b.fillRect(rnd(i, 31) * W - len / 2 + t * 3, WLv + d, len, 1.4 + d / 600);
    }
    b.globalCompositeOperation = 'source-over';
  });
}
function blitWorld(zoom, px, py, alpha = 1) { g.save(); g.globalAlpha = alpha; g.translate(px, py); g.scale(zoom, zoom); g.translate(-px, -py); g.drawImage(worldC, 0, 0); g.restore(); }
function lanternRow(b, lans, WLv, t, level) {
  lans.forEach(l => {
    const k = Math.min(1, level(l));
    b.fillStyle = '#080a1c'; b.fillRect(l.x - 1, l.y, 2, WLv - 8 - l.y); b.fillRect(l.x - 6, l.y - 10, 12, 2.5);
    b.fillStyle = css(ramp([[0, [86, 90, 134]], [1, [255, 232, 204]]], k)); b.fillRect(l.x - 4.5, l.y - 7.5, 9, 13);
  });
  b.globalCompositeOperation = 'lighter';
  lans.forEach(l => { const k = level(l); glowAt([255, 188, 122], .55 * k, l.x, l.y, 30); glowAt([255, 168, 128], .1 * k, l.x, l.y - 24, 116); });
  b.globalCompositeOperation = 'source-over';
}
function walkers(b, t, WLv, n, seed) {
  for (let i = 0; i < n; i++) {
    const dir = i % 2 ? 1 : -1, sp = 8 + rnd(i, seed) * 7, span = W + 80, h = 23 + rnd(i, seed + 2) * 6;
    const x = (((rnd(i, seed + 1) * span + dir * sp * t) % span) + span) % span - 40, y = WLv - 8, sw = Math.sin(t * sp * .42 + i) * h * .11;
    b.fillStyle = b.strokeStyle = '#060817'; b.fillRect(x - h * .11, y - h * .8, h * .22, h * .5);
    b.beginPath(); b.arc(x, y - h * .9, h * .1, 0, TAU); b.fill();
    b.lineWidth = h * .09; b.beginPath(); b.moveTo(x, y - h * .34); b.lineTo(x + sw, y); b.moveTo(x, y - h * .34); b.lineTo(x - sw, y); b.stroke();
  }
}
function stars(b, t, k, top) {
  for (let i = 0; i < 70; i++) {
    const a = (.2 + .55 * rnd(i, 23)) * (.62 + .38 * Math.sin(t * (1 + rnd(i, 24) * 2) + i)) * k, r = 1.6 + rnd(i, 25) * 1.8;
    if (a > .01) { b.fillStyle = css([222, 230, 255], Math.min(1, a)); b.fillRect(rnd(i, 21) * W, rnd(i, 22) * top, r, r); }
  }
}

// ======== 镜头一：天黑前 → 亮灯（0–7 秒）========
const LAN1 = Array.from({length: 27}, (_, i) => { const x = 20 + i * 40 + (rnd(i, 3) - .5) * 10; return {x, y: WL1 - 30 - rnd(i, 5) * 3, on: 2 + Math.abs(x - 540) / 540 * 1.3 + rnd(i, 7) * .15, ph: rnd(i, 9) * TAU}; });
function shotDusk(t, alpha = 1) {
  const nk = ease(clamp((t - 2) / 4.4));                            // 天色：0 = 傍晚，1 = 入夜
  const level = l => clamp((t - l.on) / .16) * (1 + .6 * clamp(1 - (t - l.on) / .45)) * (.92 + .08 * Math.sin(t * 5.3 + l.ph));
  on(aboveC, b => {
    b.globalCompositeOperation = 'source-over'; b.globalAlpha = 1;
    b.drawImage(ART.skyDusk, 0, 0, W, WL1); b.globalAlpha = nk; b.drawImage(ART.skyNight, 0, 0, W, WL1); b.globalAlpha = 1;
    b.globalCompositeOperation = 'lighter'; glowAt([255, 176, 110], .5 * (1 - nk), 330, 1190, 620, 300, 1.3); b.globalCompositeOperation = 'source-over';   // 落日的余光
    stars(b, t, nk, 880);
    b.drawImage(ART.myokoNight, 0, 0); b.globalAlpha = 1 - nk; b.drawImage(ART.myokoDusk, 0, 0); b.globalAlpha = 1;
    b.drawImage(ART.hills1, 0, 0);
    b.globalAlpha = 1 - nk * .9; b.drawImage(ART.t1Dusk, 0, 0); b.globalAlpha = 1;
    if (t > 2) {                                                    // 每盏灯照亮它头顶的一团花，从中间往两边亮开
      const full = clamp((t - 3.5) / .9);
      on(workC, w => {
        w.globalCompositeOperation = 'source-over'; w.clearRect(0, 0, W, WL1);
        LAN1.forEach(l => { const p = easeOut(clamp((t - l.on) / .8)); if (p > 0) { const r = 60 + p * 330; w.globalAlpha = Math.min(1, p * 2); w.drawImage(radialSprite([255, 255, 255], .5), l.x - r, WL1 - 70 - r, r * 2, r * 2); } });
        w.globalAlpha = full; w.fillStyle = '#fff'; w.fillRect(0, 0, W, WL1); w.globalAlpha = 1;
        w.globalCompositeOperation = 'source-in'; w.drawImage(ART.t1Lit, 0, 0); w.globalCompositeOperation = 'source-over';
      });
      b.drawImage(workC, 0, 0, W, WL1, 0, 0, W, WL1);
    }
    b.fillStyle = '#090c20'; b.fillRect(0, WL1 - 9, W, 9);
    walkers(b, t, WL1, 9, 40);
    lanternRow(b, LAN1, WL1, t, level);
  });
  composeWorld(t, WL1, LAN1, level, {a0: 1, a1: .86, amp: 5, shade: .35 + .5 * nk, glint: [255, 226, 214]});
  blitWorld(1.05 - .05 * t / C1, 540, WL1, alpha);
}

// ======== 镜头二：沿着一排灯笼走（7–13 秒）========
const BOKEH = Array.from({length: 34}, (_, i) => ({x: rnd(i, 71) * 1900 - 100, row: i % 3, r: 14 + rnd(i, 73) * 30, z: .25 + rnd(i, 74) * .35, a: .1 + rnd(i, 75) * .2, c: [0, 0, 1, 2, 0, 3][i % 6]}));
const HEADS = Array.from({length: 7}, (_, i) => ({x: -260 + i * 235 + rnd(i, 81) * 80, s: .8 + rnd(i, 82) * .5, v: 26 + rnd(i, 83) * 22}));
function shotLamps(t) {
  const u = t - C1, shift = u * TRAVEL;
  g.drawImage(ART.lampBg, 0, 0, W, H);
  glowAt([150, 96, 150], .32, 540, 700, 900, 520, 1.2);
  g.globalCompositeOperation = 'lighter';                           // 对岸的灯和它们在水里的影子，都在焦外
  BOKEH.forEach((o, i) => {
    const x = o.x - shift * o.z, y = o.row === 2 ? 1330 + rnd(i, 76) * 60 : 1205 + rnd(i, 76) * 34, r = o.r * (o.row === 2 ? 1.2 : 1);
    g.globalAlpha = o.a * (o.row === 2 ? .5 : 1) * (.75 + .25 * Math.sin(t * (1 + o.z) + i * 2.1)); g.drawImage(ART.disc[o.c], x - r, y - r * (o.row === 2 ? 1.5 : 1), r * 2, r * 2 * (o.row === 2 ? 1.5 : 1));
  });
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.globalAlpha = .9; g.drawImage(ART.boughsFar, -60 - shift * .45, -30, ART.boughsFar.width * 1.5, 510 * 1.5); g.globalAlpha = 1;
  const sway = Math.sin(t * 1.2) * 5;
  for (let i = -1; i < 7; i++) {                                    // 灯笼和它的光
    const x = 120 + i * 330 - shift, k = .93 + .07 * Math.sin(t * 4.7 + i * 2.4);
    if (x < -260 || x > W + 260) continue;
    g.globalCompositeOperation = 'lighter'; glowAt([255, 176, 110], .34 * k, x, 1090, 430, 430, 1.4); glowAt([255, 208, 150], .4 * k, x, 1090, 170); g.globalCompositeOperation = 'source-over';
    g.drawImage(ART.bonbori, x - 110, 940);
    g.globalCompositeOperation = 'lighter'; glowAt([255, 232, 190], .3 * k, x, 1090, 92, 110); g.globalCompositeOperation = 'source-over';
  }
  g.drawImage(ART.boughs, -130 - shift + sway * .4, -10 + Math.abs(sway) * .3);
  g.fillStyle = '#04050e';                                          // 近处走过的人
  HEADS.forEach((h, i) => {
    const x = h.x + u * h.v, y = 1846 + Math.sin(t * 2.2 + i * 1.7) * 5, s = h.s;
    g.beginPath(); g.ellipse(x, y - 96 * s, 46 * s, 54 * s, 0, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(x - 130 * s, H + 10); g.quadraticCurveTo(x - 120 * s, y - 30 * s, x - 36 * s, y - 44 * s); g.lineTo(x + 36 * s, y - 44 * s); g.quadraticCurveTo(x + 120 * s, y - 30 * s, x + 130 * s, H + 10); g.fill();
  });
}

// ======== 镜头三、四：三重橹映在护城河里 → 21:00 熄灯（13–26 秒）========
const LAN3 = Array.from({length: 27}, (_, i) => { const x = 20 + i * 40 + (rnd(i, 13) - .5) * 10; return {x, y: WL3 - 30 - rnd(i, 15) * 3, off: OFF + Math.abs(x - 540) / 540 * .8 + rnd(i, 17) * .1, ph: rnd(i, 19) * TAU}; });
function shotMirror(t) {
  const m = ease(clamp((t - OFF - .1) / 1.4));                      // 0 = 亮着灯，1 = 熄灯后只剩月色
  const level = l => (1 - clamp((t - l.off) / .22)) * (.92 + .08 * Math.sin(t * 5.3 + l.ph));
  on(aboveC, b => {
    b.globalCompositeOperation = 'source-over'; b.globalAlpha = 1;
    b.drawImage(ART.skyNight, 0, 0, W, WL3);
    glowAt([70, 86, 170], .16 + .14 * m, 540, 420, 900, 520, 1.2);
    stars(b, t, 1 + .7 * m, 760);
    b.drawImage(ART.back3, 0, 0);
    b.globalCompositeOperation = 'lighter';
    glowAt([255, 232, 196], .22 * (1 - m), 540, 660, 380, 330); glowAt([126, 176, 112], .2 * (1 - m), 540, 850, 300, 50);
    b.globalCompositeOperation = 'source-over';
    b.drawImage(ART.turDusk, 320, 405); b.globalAlpha = 1 - m; b.drawImage(ART.turLit, 320, 405); b.globalAlpha = 1;
    b.drawImage(ART.t3Moon, 0, 0); b.globalAlpha = 1 - m; b.drawImage(ART.t3Lit, 0, 0); b.globalAlpha = 1;
    b.fillStyle = '#090c20'; b.fillRect(0, WL3 - 9, W, 9);
    walkers(b, t, WL3, 8, 50);
    lanternRow(b, LAN3, WL3, t, level);
    b.fillStyle = css([255, 232, 236], .8 - .45 * m); b.beginPath();   // 几片被风带起来的花瓣
    for (let i = 0; i < 46; i++) {
      const x = ((rnd(i, 91) * 1200 + t * (30 + rnd(i, 92) * 40)) % 1200) - 60, y = ((rnd(i, 93) * 620 + t * (22 + rnd(i, 94) * 26)) % 620) + 400 + Math.sin(t * 2 + i) * 8;
      const r = 2.2 + rnd(i, 95) * 2.4, rot = i + t * (1 + rnd(i, 96) * 2), flip = .35 + .65 * Math.abs(Math.sin(t * 3 + i * 1.3));
      b.moveTo(x + Math.cos(rot) * r, y + Math.sin(rot) * r); b.ellipse(x, y, r, r * .6 * flip, rot, 0, TAU);
    }
    b.fill();
  });
  composeWorld(t, WL3, LAN3, level, {a0: .96, a1: .5, amp: 3.2, shade: .8, glint: [186, 202, 255]});
  blitWorld(1 + .07 * clamp((t - C2) / (T - C2)), 540, WL3);
}

// ======== 中下方的字 ========
function shadowed(draw) { g.shadowColor = 'rgba(3,5,16,.82)'; g.shadowBlur = 22; g.shadowOffsetY = 2; draw(); g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; }
function bandAt(y, a) { g.globalAlpha = a; g.drawImage(ART.band, 0, y, W, 420); g.globalAlpha = 1; }
function drawCopy(t) {
  if (t < C1) {                                                     // 大钟：17:58 → 18:00 亮灯
    const lit = t >= 2, fade = clamp((C1 - .35 - t) / .4), s = clockAt(t), pop = lit ? 1 + .05 * clamp(1 - (t - 2) / .5) : 1;
    bandAt(1330, .55 * fade * (lit ? ease(clamp((t - 2) / 2)) : .25));
    g.save(); g.globalAlpha = fade; g.translate(540, 1540); g.scale(pop, pop);
    shadowed(() => {
      const wh = measure('00', 190, 200, 2, 'latin');
      text(s.slice(0, 2), -34, 0, 190, lit ? TYPE.gold : WHITE, 200, 'right', 2, 'latin');
      g.globalAlpha = fade * (lit ? 1 : .35 + .65 * Math.abs(Math.cos(t * Math.PI / .9 * .5)));
      text(':', 0, -12, 190, lit ? TYPE.gold : WHITE, 200, 'center', 0, 'latin'); g.globalAlpha = fade;
      text(s.slice(3), 34, 0, 190, lit ? TYPE.gold : WHITE, 200, 'left', 2, 'latin');
      const k = clamp((t - 2) / .3);
      if (k < 1) { g.globalAlpha = fade * (1 - k); text(COPY.before, 0, 84, 33, SOFT, 300, 'center', 4); }
      if (k > 0) { g.globalAlpha = fade * k; text(COPY.after, 0, 84, 36, WHITE, 400, 'center', 10); }
    });
    g.restore(); g.globalAlpha = 1;
  }
  const sl = scene(t, C1 + .7, C2 - .15);
  if (sl) bandAt(1290, .8 * sl.p * sl.out);
  rise(sl, () => shadowed(() => {
    const n = Math.round(3000 * easeOut(sl.age / 1.3) / 10) * 10;
    line([[n.toLocaleString('en-US'), 170, TYPE.gold, 200, -4, COPY.lamps[0]], ['  ' + COPY.lamps[1], 52, WHITE, 300, 6]], 1520);
    text(COPY.lampsSub, 540, 1600, 33, SOFT, 300, 'center', 4);
  }));
  const sn = scene(t, C2 + 1.1, OFF - .5);
  if (sn) { bandAt(1290, sn.p * sn.out); bandAt(1330, .6 * sn.p * sn.out); }
  rise(sn, () => shadowed(() => {
    text(COPY.name, 540 + 13, 1530, 104, WHITE, 200, 'center', 26);
    g.fillStyle = TYPE.gold; g.fillRect(540 - 30, 1574, 60, 2);
    text(COPY.nameSub, 540, 1636, 33, SOFT, 300, 'center', 4);
  }));
  rise(scene(t, OFF + 1.5, T - .5), () => shadowed(() => {            // 片尾提醒：左对齐
    text(COPY.end[0], 80, 1420, 66, WHITE, 300, 'left', 5);
    text(COPY.end[1], 80, 1518, 66, WHITE, 300, 'left', 5);
    g.fillStyle = TYPE.coral; g.beginPath(); g.arc(88, 1589, 6, 0, TAU); g.fill();
    text(COPY.endNote, 108, 1600, 32, TYPE.gold, 400, 'left', 2);
  }));
}

function render(time) {
  const t = ((time % T) + T) % T;
  build();
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.shadowColor = 'transparent'; g.shadowBlur = 0;
  if (t < C1) shotDusk(t);
  else if (t < C2) shotLamps(t);
  else shotMirror(t);
  if (t > T - .45) shotDusk(0, ease((t - (T - .45)) / .45));         // 回到第二天的傍晚
  g.drawImage(ART.topScrim, 0, 0, W, 620);
  g.drawImage(ART.vig, 0, 0, W, H);
  const lamp = t < C1 ? clamp((t - 2) / 1.5) : t < OFF ? 1 : 1 - clamp((t - OFF) / 1);
  drawHeader(t, {light: .5 * lamp, lc: [255, 214, 170], x: 260 + 60 * Math.sin(t * .5)}, HEADER);
  if (t >= C1) { g.globalAlpha = clamp((t - C1) / .4) * clamp((T - .45 - t) / .3); text(clockAt(t), W - 80, 262, 28, t >= OFF ? TYPE.accent : TYPE.gold, 500, 'right', 3, 'latin'); g.globalAlpha = 1; }
  drawCopy(t);
}
// 给检查工具读的状态
function inspectAt(time) {
  const t = ((time % T) + T) % T;
  return {t, shot: PLAN.find(p => t >= p[1] && t < p[2])[0], clock: clockAt(t),
    lanternsOn: t < C1 ? LAN1.filter(l => t >= l.on).length : t < C2 ? null : LAN3.filter(l => t < l.off).length};
}
boot(render);
</script>
