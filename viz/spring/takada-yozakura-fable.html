<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };

const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;
  if (sprites[key]) return sprites[key];
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(N, N), d = img.data;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(i + .5 - N / 2, j + .5 - N / 2) / (N / 2), k = (j * N + i) * 4;
    d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = Math.round(255 * Math.pow(Math.max(0, 1 - r), falloff));
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function verticalSprite(key, stops) {                 // 竖直方向的渐变条：stops = [[位置0~1, [r,g,b,a]], ...]
  if (sprites[key]) return sprites[key];
  const N = 512, c = document.createElement('canvas'); c.width = 1; c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(1, N), d = img.data;
  for (let j = 0; j < N; j++) {
    const u = (j + .5) / N; let k = 0; while (k < stops.length - 2 && u > stops[k + 1][0]) k++;
    const [u0, a] = stops[k], [u1, b] = stops[k + 1], f = clamp((u - u0) / (u1 - u0));
    for (let n = 0; n < 4; n++) d[j * 4 + n] = Math.round(a[n] + (b[n] - a[n]) * f);
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function glowAt(rgb, alpha, x, y, rx, ry = rx, falloff) {
  if (alpha <= .002) return;
  g.globalAlpha = Math.min(1, alpha); g.drawImage(radialSprite(rgb, falloff), x - rx, y - ry, rx * 2, ry * 2); g.globalAlpha = 1;
}
const hsl2rgb = (h, s, l) => {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => 255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
};

// ======== 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ========
// 繁体版（<html lang="zh-TW">）自动换成思源黑体繁体
const TC = document.documentElement.lang === 'zh-TW';
const FONTS = TC ? {
  cjk:   '"Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',
  latin: '"Sora","Source Han Sans TC",sans-serif',
} : {
  cjk:   '"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',
  latin: '"Sora","Source Han Sans SC",sans-serif',
};
// ---- 文字工具 ----
const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {
  g.font = `${weight} ${size}px ${FONTS[fam]}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function resetSpacing(c = g) { if ('letterSpacing' in c) c.letterSpacing = '0px'; }
function measure(s, size, weight = 400, spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  setFont(size, weight, spacing, fam); const w = g.measureText(s).width - spacing; resetSpacing(); return w;
}
function text(s, x, y, size, color, weight = 400, align = 'left', spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  const w = measure(s, size, weight, spacing, fam);
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  setFont(size, weight, spacing, fam); g.textAlign = 'left'; g.fillStyle = color; g.fillText(s, left, y); resetSpacing();
  return w;
}
// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动
// parts: [文字, 字号, 颜色, 字重, 字距, 最终值]
function line(parts, y) {
  const ws = parts.map(([s, size, , wt = 400, sp = 0, slot]) => measure(slot || s, size, wt, sp));
  let x = (W - ws.reduce((a, b) => a + b, 0)) / 2;
  parts.forEach(([s, size, color, wt = 400, sp = 0, slot], i) => {
    text(s, slot ? x + ws[i] : x, y, size, color, wt, slot ? 'right' : 'left', sp); x += ws[i];
  });
  return ws.reduce((a, b) => a + b, 0);
}
function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);
  if (age > dur) return 0;
  return {p: from > to && t < to ? 1 : easeOut(age / .55), out: clamp((dur - age) / .35), age};

// 字号偏大、中等字重，一律带柔和的深色字影，叠在任何背景上都看得清、也有一点立体感。一句太长时自动缩小字号。
// story: [[开始秒, 结束秒, 一句话], ...]，一次只放一行
const STORY_SHADOW = 'rgba(4,6,16,.85)';
function drawStory(t, story, color = NARRATION, bar = TYPE.accent, shadow = STORY_SHADOW) {
  story.forEach(([from, to, s]) => {
    if (t < from || t > to) return;

    let size = 38; while (size > 30 && measure(s, size, 500, 1.5) > 900) size--;
    g.globalAlpha = out * clamp((t - from) / .3);
    g.fillStyle = bar; g.fillRect(80, y - 33, 3, 44);          // 竖细线：提示「这是旁白」
    setFont(size, 500, 1.5); g.textAlign = 'left';
    g.shadowColor = shadow || STORY_SHADOW; g.shadowBlur = 9; g.shadowOffsetY = 1;
    let x = 102;
    [...s].forEach((c, i) => {
      const p = clamp((t - from - i * .05) / .45);           // 每个字晚 0.05 秒出现

      x += g.measureText(c).width;
    });
    g.globalAlpha = 1; g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; resetSpacing();
  });
}

// ======== 标题：镜面金属字（全系列统一）========
//  - 底色是接近白色的哑光银，从上到下平滑地由亮变暗（不要中间一道暗色「地平线」，在大字上会看成一条横线）
//  - 字面映出此刻的场景：截一块画面、上下翻转、缩到很小（相当于金属表面的模糊），以「柔光」叠上去，是一层光泽而不是清晰的倒影
//  - 倒角：上沿一道亮边、下沿一道暗边，让字有厚度；字外一圈外浮雕；下面一层很轻的投影

      const grow = Math.min(1, .6 + age * 2), rx = 3.5 * p.s * p.el * grow, ry = 3.5 * p.s * (.34 + .3 * p.dn) * grow;
      if (rx < 2.7) b.rect(x - rx, y - ry, rx * 2, ry * 2);
      else { b.moveTo(x + rx, y); b.ellipse(x, y, rx, ry, 0, 0, TAU); }
    }
    b.fill();
  }
  for (let c = 0; c < 3; c++) {                                        // 还在风里的
    b.fillStyle = AIR_COL[c]; b.beginPath();
    for (const p of PET) {
      if (p.c !== c || t >= p.tau || t < p.tau - p.fall) continue;
      const u = (p.tau - t) / p.fall, rest = p.tau - t;
      const x = p.x - (120 + 170 * p.seed) * (.4 + .6 * p.s) * rest + Math.sin(t * 3.1 + p.seed * 50) * 15 * p.s * Math.min(1, u * 5);
      const y = p.y - (240 + p.d * 1.02) * Math.pow(u, 1.1);
      if (y < y0 - 20 || y > y1 + 20) continue;
      const r = 4.3 * p.s * (p.hero ? 1.6 : 1), flip = .3 + .7 * Math.abs(Math.sin(t * (3 + 4 * p.seed) + p.seed * 30)), rot = p.seed * TAU + t * (1.5 + 3 * p.seed);
      b.moveTo(x + Math.cos(rot) * r * p.el, y + Math.sin(rot) * r * p.el); b.ellipse(x, y, r * p.el, r * .62 * flip, rot, 0, TAU);
    }
    b.fill();
  }
}

// ======== 世界：岸上 + 水面（倒影、灯在水里拉出的光、花瓣），画到 worldC，再按镜头贴到屏幕 ========
function renderWorld(t, lt, camY) {
  paintAbove(t, lt);
  const cy = Math.floor(camY), nt = nightAt(lt), y0 = cy, y1 = cy + H + 2;
  on(worldC, b => {
    b.setTransform(1, 0, 0, 1, 0, -cy); b.globalAlpha = 1; b.globalCompositeOperation = 'source-over';
    if (y0 < WL) b.drawImage(aboveC, 0, 0);
    if (nt < 1) b.drawImage(ART.waterDusk, 0, WL, W, 2140);
    b.globalAlpha = nt; b.drawImage(ART.waterNight, 0, WL, W, 2140);
    const SH = 3, d0 = Math.max(0, Math.floor((y0 - WL) / SH) * SH), d1 = Math.min(WL - SH, y1 - WL);
    for (let d = d0; d < d1; d += SH) {                               // 倒影：一条一条翻下来，越近水波越大、影子越淡
      const amp = Math.min(6, 1 + d * .008);
      const dx = Math.sin(d * .105 - t * 2 + 1.7 * Math.sin(d * .021 + t * .6)) * amp + Math.sin(d * .31 + t * 3.1) * amp * .22;
      b.globalAlpha = lerp(.95, .58, clamp(d / 1100));
      b.drawImage(aboveC, 0, WL - d - SH, W, SH, dx - 14, WL + d, W + 28, SH);
    }
    b.globalAlpha = 1; b.fillStyle = 'rgba(4,6,18,.55)'; b.fillRect(0, WL, W, 3);
    b.globalCompositeOperation = 'lighter';
    b.globalCompositeOperation = 'source-over';                                                 // 水里的月亮：一枚被水波轻轻拉扁的圆
    const mx = 912 + Math.sin(t * 1.1) * 3, my = WL + 808;
    glowAt([10, 13, 40], .95, mx, my, 62, 62, .8);
    b.globalCompositeOperation = 'lighter'; glowAt([196, 210, 255], .2, mx, my, 150, 240);
    for (let n = -9; n <= 9; n++) { const hw = Math.sqrt(1 - n * n / 90.25) * 28; b.fillStyle = css([236, 238, 232], .78 - Math.abs(n) * .02); b.fillRect(mx - hw + Math.sin(t * 2.2 + n * .9) * 3.2, my + n * 3.4 - 1.7, hw * 2, 3.4); }
    LAN.forEach((l, i) => {                                           // 灯笼在水里拉出的光
      const k = lanLevel(l, t, lt); if (k < .02) return;
      for (let j = 0; j < 30; j++) {
        const d = 5 + j * 8 + j * j * .45, w = 2.4 + j * .16, a = k * .26 * Math.pow(1 - j / 30, 1.3) * (.55 + .45 * Math.sin(t * 2.6 + j * 1.1 + i * 2.3));
        if (WL + d < y0 - 30 || a <= .004) continue;
        b.fillStyle = css([255, 198, 138], a); b.fillRect(l.x - w / 2 + Math.sin(d * .15 - t * 2.2 + i) * (.6 + j * .22), WL + d, w, 11 + j * .9);
      }
    });
    for (let i = 0; i < 150; i++) {                                    // 水面的碎光
      const d = 20 + Math.pow(rnd(i, 32), 1.5) * DEPTH, y = WL + d; if (y < y0 || y > y1) continue;
      const a = .11 * Math.pow(Math.max(0, Math.sin(t * (.8 + rnd(i, 33)) + i * 1.9)), 3); if (a < .01) continue;
      const len = 8 + 34 * d / DEPTH; b.fillStyle = css([186, 202, 255], a); b.fillRect(rnd(i, 31) * W - len / 2 + t * 3, y, len, 1.4 + d / DEPTH * 1.6);
    }
    b.globalCompositeOperation = 'source-over';
    drawPetals(b, t, y0, y1);
    b.setTransform(1, 0, 0, 1, 0, 0);
  });
  return camY - cy;
}
function shotWorld(t, lt, camY, zoom = 1, alpha = 1) {
  const fy = renderWorld(t, lt, camY);
  g.save(); g.globalAlpha = alpha; g.translate(700, 1010); g.scale(zoom, zoom); g.translate(-700, -1010); g.drawImage(worldC, 0, -fy); g.restore();
}
const waterCam = t => 1098 + 84 * (t - CUT2) / (T - CUT2);            // 水面镜头：很慢地往下移

// ======== 特写：一根花枝，背后是失焦的灯笼 ========
const LOOSE = [[7.7, 930, 905, .3], [8.75, 650, 1010, .7]];
function shotMacro(t) {
  const u = t - CUT1, slide = u * 12, f = ease(clamp(u / .85));
  g.drawImage(ART.macroBg, -40 - slide * .35, 0);
  g.globalCompositeOperation = 'lighter';
  BOKEH.forEach((o, i) => {
    const x = o.x - slide * (.5 + o.z * 1.3), r = o.r * (1.24 - .24 * f);
    g.globalAlpha = o.a * (.72 + .28 * Math.sin(t * (1 + o.z) + i * 2.1)); g.drawImage(ART.disc[o.c], x - r, o.y - r, r * 2, r * 2);
  });
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const sway = .011 * Math.sin(t * 1.1 + 1) + .005 * Math.sin(t * 2.7);
  g.save(); g.translate(1250 - slide * .5, 430); g.rotate(sway); g.translate(-1250, -430);
  g.globalAlpha = 1 - f * f; g.drawImage(ART.brBlur, -BR_OX, -BR_OY);
  g.globalAlpha = f; g.drawImage(ART.br, -BR_OX, -BR_OY);
  g.restore(); g.globalAlpha = 1;
  LOOSE.forEach(([t0, x0, y0, s]) => {                                 // 一片花瓣离开枝头
    const a = t - t0; if (a <= 0) return;
    const x = x0 - 56 * a - 30 * Math.sin(a * 2.6 + s * 6), y = y0 + 250 * a + 34 * a * a;
    g.save(); g.translate(x, y); g.rotate(s * 5 + a * 2.2); g.scale(.62, .62 * (.35 + .65 * Math.abs(Math.cos(a * 3.1 + s * 4))));
    g.globalAlpha = clamp(a / .15); g.drawImage(ART.petal, -40, -50); g.restore();
  });
  g.globalAlpha = 1;
  glowAt([4, 5, 18], .6, 330, 1470, 800, 430);                         // 托住左下的字
}

// ======== 左下的字：英文小标 / 大字 / 一行补充 ========
const LX = 80, BIG_Y = 1432;
function withShadow(draw) {
  g.shadowColor = 'rgba(3,5,16,.8)'; g.shadowBlur = 22; g.shadowOffsetY = 2; draw();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
}
function kicker(s, y = BIG_Y - 150) { g.fillStyle = TYPE.gold; g.fillRect(LX + 2, y - 30, 34, 2); text(s, LX + 2, y, 23, TYPE.accent, 500, 'left', 6); }
function drawCopy(t) {
  if (t < CUT1) glowAt([4, 6, 20], .86 * clamp((t - 2.5) / .6), 300, BIG_Y - 30, 900, 330, 1.1);
  rise(scene(t, 2.75, CUT1 - .15), () => withShadow(() => {
    kicker(COPY.a.kicker);
    const w = text(COPY.a.big[0], LX, BIG_Y, 92, WHITE, 200, 'left', 8);
    text(COPY.a.big[1], LX + w + 16, BIG_Y, 92, TYPE.gold, 400, 'left', 8);
    text(COPY.a.sub, LX + 2, BIG_Y + 74, 33, SOFT, 300, 'left', 4);
  }));
  const sb = scene(t, 6.3, CUT2 - .15);
  rise(sb, () => withShadow(() => {
    kicker(COPY.b.kicker);
    const n = Math.round(4000 * easeOut(sb.age / 1.2) / 10) * 10, s = n.toLocaleString('en-US');
    const w0 = text(COPY.b.pre, LX, BIG_Y, 54, WHITE, 300, 'left', 4);
    const wn = measure(COPY.b.num, 150, 200, -4, 'latin');
    text(s, LX + w0 + 22 + wn, BIG_Y, 150, TYPE.gold, 200, 'right', -4, 'latin');
    text(COPY.b.post, LX + w0 + 22 + wn + 22, BIG_Y, 54, WHITE, 300, 'left', 6);
    text(COPY.b.sub, LX + 2, BIG_Y + 74, 33, SOFT, 300, 'left', 4);
  }));
  rise(scene(t, 10.7, WIND - .25), () => withShadow(() => {
    kicker(COPY.c.kicker, BIG_Y - 264);
    const w = text(COPY.c.big[0], LX, BIG_Y - 116, 94, WHITE, 200, 'left', 8);
    text(COPY.c.big[1], LX + w + 8, BIG_Y - 116, 94, TYPE.accent, 400, 'left', 8);
    text(COPY.c.big[2], LX, BIG_Y, 94, WHITE, 200, 'left', 8);
    text(COPY.c.sub, LX + 2, BIG_Y + 74, 33, SOFT, 300, 'left', 4);
  }));
  rise(scene(t, 15.4, T - .45), () => withShadow(() => {
    kicker(COPY.d.kicker, BIG_Y - 196);
    text(COPY.d.big, LX - 4, BIG_Y, 164, TYPE.gold, 300, 'left', 18);
    text(COPY.d.sub, LX + 2, BIG_Y + 78, 33, SOFT, 300, 'left', 4);
  }));
}

function render(time) {
  const t = ((time % T) + T) % T;
  build();
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.shadowColor = 'transparent'; g.shadowBlur = 0;
  if (t < CUT1) shotWorld(t, t, 0, 1 + .06 * t / CUT1);
  else if (t < CUT2) shotMacro(t);
  else shotWorld(t, 99, waterCam(t));
  if (t > T - .4) shotWorld(0, 0, 0, 1, ease((t - (T - .4)) / .4));    // 回到天刚黑的时候
  g.drawImage(ART.topScrim, 0, 0, W, 620);
  g.drawImage(ART.vig, 0, 0, W, H);
  const lamp = t < CUT1 ? clamp((t - .4) / 2.2) : 1;
  drawHeader(t, {light: .5 * lamp, lc: [255, 214, 170], x: 260 + 60 * Math.sin(t * .5)}, HEADER);
  drawCopy(t);
}
// 给检查工具读的状态
function inspectAt(time) {
  const t = ((time % T) + T) % T, shot = PLAN.find(p => t >= p[1] && t < p[2])[0];
  return {t, shot, camY: t < CUT1 ? 0 : t < CUT2 ? null : waterCam(t), zoom: t < CUT1 ? 1 + .06 * t / CUT1 : 1,
    lanternsOn: t < CUT1 ? LAN.filter(l => t >= l.on).length : LAN.length,
    petalsAir: PET.filter(p => t < p.tau && t >= p.tau - p.fall).length, petalsFloat: PET.filter(p => t >= p.tau).length};
}
boot(render);
</script>
