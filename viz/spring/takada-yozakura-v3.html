<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(232,238,248,.9)';       // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};

    const n = .65 * vnoise(X0 * s * .0042 + 3, y * .011) + .35 * vnoise(X0 * s * .011 + 9, y * .03 + 4), rank = clamp(1.1 - ease(clamp((n - .22) / .56)) * 1.1 + (q() - .5) * .16);

const HEADER = {title: '高田夜樱', place: '新潟县上越市', story: STORY, sheen: [60, 160, W - 120, 420], storyColor: P.narr};
const LINE1 = 1440, LINE2 = 1500;
const HL = {size: 68, weight: 300, sp: 8}, SUBT = {size: 30, weight: 300, sp: 2};
function rich(segs, y) {
  const ws = segs.map(([s]) => measure(s, HL.size, HL.weight, HL.sp) + HL.sp);
  let x = (W - ws.reduce((p, q) => p + q, 0) + HL.sp) / 2;
  segs.forEach(([s, key], i) => { text(s, x, y, HL.size, key ? P.key : P.head, HL.weight, 'left', HL.sp); x += ws[i]; });
}
function headline(s, segs, sub, strong) {
  rise(s, () => {
    g.shadowColor = strong ? 'rgba(26,6,30,.95)' : 'rgba(6,4,16,.7)'; g.shadowBlur = strong ? 22 : 14;
    rich(segs, LINE1); if (strong) rich(segs, LINE1);
    for (let k = 0; k < (strong ? 2 : 1); k++) text(sub, W / 2, LINE2 + 6, SUBT.size, P.sub, strong ? 400 : SUBT.weight, 'center', SUBT.sp);
    g.shadowColor = 'transparent'; g.shadowBlur = 0;
  });
}
const TEXT_WINDOWS = [[0, 5.2], [6.6, 10.3], [11.6, 14.7], [17.6, 21.7]];
const HEADLINES = [
  [[['日本三大', 0], ['夜樱', 1]], '高田城址公园 三重橹'],
  [[['樱花在', 0], ['水里', 1], ['再开一遍', 0]], '护城河上的朱红长桥'],
  [[['约 ', 0], ['4,000', 1], [' 棵樱花', 0]], '纸灯笼一路亮到晚上 9 点'],
  [[['花筏', 1]], '花瓣铺满水面 日语叫「花筏」'],
];
const vignette = (() => {
  const [c, x] = mk(135, 240), img = x.createImageData(135, 240), d = img.data;
  for (let j = 0; j < 240; j++) for (let i = 0; i < 135; i++) { const rr = Math.hypot((i + .5) / 135 - .5, ((j + .5) / 240 - .5) * 1.25) / .72, k = (j * 135 + i) * 4; d[k] = 2; d[k + 1] = 3; d[k + 2] = 12; d[k + 3] = 150 * Math.pow(clamp((rr - .55) / .6), 1.7); }
  x.putImageData(img, 0, 0); return c;
})();

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const shot = shotAt(t);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#060a20'; g.fillRect(0, 0, W, H);
  [shotA, shotB, shotC, shotD][shot](t);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.imageSmoothingQuality = 'high'; g.drawImage(vignette, 0, 0, W, H);
  let dip = 0; [5.6, 10.6, 15].forEach(c => { dip = Math.max(dip, 1 - Math.abs(t - c) / .2); });      // 换镜头时轻轻暗一下
  if (dip > 0) { g.fillStyle = `rgba(3,4,12,${dip * .8})`; g.fillRect(0, 0, W, H); }
  g.drawImage(verticalSprite('topscrim150', [[0, [4, 6, 20, 160]], [1, [4, 6, 20, 0]]]), 0, 0, W, 600);
  const strong = shot >= 2;
  g.drawImage(verticalSprite('band' + shot, [[0, [4, 5, 18, 0]], [.5, [4, 5, 18, strong ? 150 : 100]], [1, [4, 5, 18, 0]]]), 0, 1280, W, 340);
  drawHeader(t, {light: .35, lc: [255, 214, 225], x: W * .6}, HEADER);
  TEXT_WINDOWS.forEach(([a, b], i) => {
    const s = i === 0 ? (t < b ? {p: 1, out: clamp((b - t) / .35), age: t} : 0) : scene(t, a, b);      // 封面：第 0 秒字就在画面上
    headline(s, ...HEADLINES[i], strong);
  });
}
boot(render);
</script>
