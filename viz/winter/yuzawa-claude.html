<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(232,238,248,.9)';       // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

//  - 被场景里的光照出一块柔和的高光，位置、颜色跟着光源走，亮度有上限

const TX = 30, TB = 190;                 // 标题在缓存画布里的位置
const titleLayers = {};
let titleText = '';
function titleLayer(key, paint) {

const titleWork = document.createElement('canvas'); titleWork.width = 860; titleWork.height = 300;

const titleShadow = () => titleLayer('shadow', x => {

const silver = () => titleLayer('silver', x => {

// ======== 播放和导出 ========

  await Promise.all(FONT_DATA.map(([family, weight, range, b64]) => {

// 视频从第几秒开始（循环是无缝的，从哪一秒开始都是完整的一圈）。页面里可以写 const START = 11.9;
// 把高潮放到视频的第一帧，不需要加速或压缩任何画面。网页播放和 record.js 导出都从这里开始。
function boot(render) {
  const start0 = typeof START === 'number' ? START : 0;

  if (!params.has('record')) {

      const start = performance.now();
      const tick = () => { render(start0 + (performance.now() - start) / 1000); requestAnimationFrame(tick); };

<script>
// 越后汤泽（新潟县汤泽町）—— 冬季，独立新稿「从云上滑进温泉」。
// 一张竖着的长画卷（山顶在上，温泉在下），镜头只做上下运动，一镜到底：
//   新干线进站 → 沿缆车升上山，穿过云层 → 山顶云海晚霞 → 跟着滑雪的人一路滑回山脚 → 落进夜里的露天温泉 → 热气漫上来，接回开头的雪雾。
// 光线跟着故事走：阴天的雪 → 云上的晚霞 → 蓝调的黄昏 → 亮灯的夜。
// 做法：世界先按「中性的白天」画好一张长图，每帧再整体乘上一层随时间变化的色调，夕阳的长影是另一张图；灯光最后叠加。
// render(t) 是确定性的：同一个 t 永远画出同一帧。

const T = 24;
const OY = 860, WH = 7660;                 // 长图覆盖的世界范围（y 向下）
const RIDGE = 1120, BASE = 5060;           // 山脊、山脚
const YS = 4270, YTOP = 200, YO = 5720;    // 镜头三个停靠点：车站、山顶、温泉

const keys = (t, ks) => {                  // 关键帧之间平滑过渡：[[时间, 值], ...]，值可以是数或数组
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) {
    const k = ease(clamp((t - ks[i - 1][0]) / (ks[i][0] - ks[i - 1][0]))), a = ks[i - 1][1], b = ks[i][1];
    return Array.isArray(a) ? a.map((v, n) => lerp(v, b[n], k)) : lerp(a, b, k);

// ======== 地形 ========
const ridgeY = x => RIDGE + 10 - 70 * Math.exp(-Math.pow((x - 700) / 400, 2)) + 9 * Math.sin(x / 97 + 1);

  const u = slopeU(y);

const gondX = y => lerp(G0[0], G1[0], (G0[1] - y) / (G0[1] - G1[1]));

// ======== 滑雪的人：路线和时间 ========
const TD0 = 10.7, TD1 = 16.3, SKI0 = 1150, SKI1 = 5030;
function skiE(u) {                          // 起步加速、匀速、最后刹停
  u = clamp(u); const a = .18, d = .12, v = 1 / (1 - a / 2 - d / 2);
  return u < a ? v * u * u / (2 * a) : u < 1 - d ? v * (u - a / 2) : 1 - v * (1 - u) * (1 - u) / (2 * d);

const TURN = 118;
function skiAmp(y) { return Math.min(150, pisteW(y) - 80) * ease(clamp((y - SKI0) / 320)) * ease(clamp((SKI1 - y) / 380)); }
const skiX = y => pisteX(y) + skiAmp(y) * Math.sin((y - SKI0) / TURN);
function skiState(t) {
  const y = skiY(t), x = skiX(y), dx = (skiX(y + 3) - skiX(y - 3)) / 6;
  const curv = (skiX(y + 14) - 2 * x + skiX(y - 14)) / 196;
  const moving = t > TD0 && t < TD1;
  return {x, y, dx, lean: moving ? clamp(curv * 46, -.52, .52) : 0, moving};
}

// ======== 镜头 ========
const TD = 15.5, TO = 18.3;
const camFollow = t => skiY(t) - (980 + 90 * ease(clamp((t - TD0) / 2)));
const CAM_P0 = camFollow(TD), CAM_V0 = (camFollow(TD) - camFollow(TD - .002)) / .002;
function camY(t) {
  if (t < 3.6) return YS - 40 * ease(t / 3.6);
  if (t < 8.4) return lerp(YS - 40, YTOP, smoother((t - 3.6) / 4.8));
  if (t < TD0) return YTOP - 30 * ease((t - 8.4) / (TD0 - 8.4));
  if (t < TD) return camFollow(t);
  if (t < TO) {                             // 人在山脚刹停，镜头带着原来的速度继续往下，落到温泉
    const d = TO - TD, u = (t - TD) / d, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * CAM_P0 + (u3 - 2 * u2 + u) * CAM_V0 * d + (-2 * u3 + 3 * u2) * YO;
  }
  return YO + 26 * ease((t - TO) / (T - TO));
}

// ======== 树 ========
function tree(c, x, y, h, seed, snowCol = '#f2f6fd') {
  const n = h > 260 ? 6 : 4, w = h * (.25 + rnd(seed, 3) * .05);
  c.fillStyle = '#3a3140'; c.fillRect(x - h * .022, y - h * .16, h * .044, h * .17);
  for (let i = 0; i < n; i++) {
    const k = i / n, by = y - h * (.1 + k * .78), hw = w * (1 - k * .82), th = h * (.34 - k * .1);
    const sag = th * .16, j = (rnd(seed, i) - .5) * hw * .2;
    c.fillStyle = i % 2 ? '#1f3350' : '#1a2b47';
    c.beginPath(); c.moveTo(x + j * .3, by - th);
    c.quadraticCurveTo(x - hw * .35, by - th * .45, x - hw + j, by);
    c.quadraticCurveTo(x - hw * .4, by + sag, x, by + sag * .4);
    c.quadraticCurveTo(x + hw * .45, by + sag, x + hw + j, by - th * .04);
    c.quadraticCurveTo(x + hw * .32, by - th * .5, x + j * .3, by - th); c.fill();
    // 枝上的积雪：盖住这一层的上半边，下沿不齐
    c.fillStyle = snowCol;
    c.beginPath(); c.moveTo(x + j * .3, by - th - h * .012);
    c.quadraticCurveTo(x - hw * .36, by - th * .48, x - hw * .96 + j, by - th * .03);
    c.quadraticCurveTo(x - hw * .55, by - th * .2, x - hw * .3, by - th * .1);
    c.quadraticCurveTo(x - hw * .05, by - th * .32, x + hw * .2, by - th * .2);
    c.quadraticCurveTo(x + hw * .45, by - th * .3, x + hw * .62 + j, by - th * .2);
    c.quadraticCurveTo(x + hw * .26, by - th * .56, x + j * .3, by - th - h * .012); c.fill();
  }
}

// 返回 {z, fx, fy, ax, ay, roll}：画面里 (fx,fy) 这一点放到屏幕 (ax,ay)，放大 z 倍
function zoomAt(t) {
  const ax = W / 2, ay = 1150;
  if (t > TD0 && t < 15.8) {
    const k = easeOut((t - TD0) / .7) * (1 - ease(clamp((t - 15.0) / .8)));
    const s = skiState(t), lag = skiX(skiY(Math.max(TD0, t - .3))), cy = camY(t);
    const z = 1 + k * (.8 + .05 * Math.sin((s.y - SKI0) / TURN * 2));
    const shake = k * 1.6 * (Math.sin(t * 47.3) + .6 * Math.sin(t * 71.9 + 1.3));
    return clampZoom({z, fx: lerp(s.x, lag, .5) + shake / z, fy: s.y - cy - 40 + shake * .6 / z, ax, ay: 1060, roll: -s.lean * .036 * k});
  }
  if (t > 18.3) {
    const z = 1 + .32 * ease(clamp((t - 18.3) / 5.7));
    return clampZoom({z, fx: 535, fy: 6850 - camY(t), ax, ay: 1120, roll: 0});
  }
  return {z: 1, fx: ax, fy: ay, ax, ay, roll: 0};
}
function clampZoom(Z) {                    // 放大后的取景框不能超出原画面（多留一点给侧倾）
  const m = Z.z > 1.001 ? 14 : 0;
  Z.fx = clamp(Z.fx, Z.ax / Z.z + m, W - (W - Z.ax) / Z.z - m);
  Z.fy = clamp(Z.fy, Z.ay / Z.z + m, H - (H - Z.ay) / Z.z - m);
  return Z;
}

  g.save(); g.translate(Z.ax, Z.ay); g.rotate(Z.roll); g.scale(Z.z, Z.z); g.translate(-Z.fx, -Z.fy);
  g.drawImage(ZBUF, 0, 0); g.restore();
}

const CAB_D = 520, CAB_N = 8, CAB_V = 7 * CAB_D / T;
function cabins(t, fn) {

function drawPowder(t, lit) {                    // lit=false：雪雾落在雪面上的淡影（参与整体色调）；true：被天光照亮的雪雾
  if (t < TD0 || t > TD1 + 1.8) return;

  for (let j = 0; j < RATE * LIFE; j++) {
    const n = Math.floor(t * RATE) - j, tau = n / RATE, age = t - tau;
    if (tau < TD0 + .2 || tau > TD1 + .08) continue;
    const s = skiState(tau), brake = clamp((tau - (TD1 - .7)) / .3);
    const power = Math.max(.32 + .68 * Math.abs(s.lean) / .5, brake * 1.25);      // 直滑时也拖着一道雪尾，压弯时最大
    const side = brake > .3 ? 1 : -Math.sign(s.lean || 1), k = age / LIFE, spread = 1 - Math.exp(-age * 2.4);
    const px = s.x + side * (14 + (50 + rnd(n, 1) * 230) * spread) * power + (rnd(n, 2) - .5) * 30;
    const py = s.y + 4 - (30 + rnd(n, 3) * 120) * spread * power + 70 * age * age + (brake > .3 ? 50 * rnd(n, 5) * age : 0);
    const r = (16 + 105 * k) * (.6 + rnd(n, 4) * .7) * (.7 + .5 * power);

}

function drawSkier(t, noShadow) {

  g.fillStyle = '#f0a23a'; roundRect(-18, -92, 36, 50, 13); g.fill();          // 上身

function drawWater(t, night) {

    const wg = g.createRadialGradient(P.x - 60, P.y - 40 - camNow, 30, P.x, P.y - camNow, P.rx);
    wg.addColorStop(0, '#2b7c82'); wg.addColorStop(.55, '#16525e'); wg.addColorStop(1, '#0a2935');
    g.globalAlpha = .82 * night; g.fillStyle = wg; g.fillRect(P.x - P.rx, P.y - P.ry - camNow, P.rx * 2, P.ry * 2); g.globalAlpha = 1;

  for (let i = 0; i < 16; i++) {                       // 灯影：一段段晃动的暖色

function drawSnow(t, k, vcam) {

  g.lineCap = 'round';
  for (let i = 0; i < 300; i++) {
    const L = i % 3, par = .3 + L * .25, cyc = 3 + L * 2 + Math.floor(rnd(i, 3) * 2);
    const y = fract(rnd(i, 2) + cyc * t / T - camNow * par / 2100) * 2100 - 90;
    const x = fract(rnd(i, 1) + .04 * Math.sin(TAU * (2 * t / T + rnd(i, 4))) + (2 + L) * t / T) * 1240 - 80;
    const r = (1.4 + L * 1.2) * (.7 + rnd(i, 5) * .7), st = clamp(vcam * par * .022, -60, 60);
    g.strokeStyle = `rgba(240,246,255,${k * (.45 + L * .2)})`; g.lineWidth = r * 2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + .5, y - st + .5); g.stroke();
  }
}

}

// ======== 文字 ========
const STORY = [
  [0.2, 3.3, '川端康成《雪国》的舞台，就在这里。'],
  [3.8, 8.1, '车站连着雪场，出了检票口就能上山。'],
  [8.6, 10.9, '一个冬天，这里的降雪累计超过 10 米。'],
  [11.2, 14.5, '雪道两边是雪松，雪粉一路扬起来。'],
  [16.9, 21.1, '滑完雪，泡进露天温泉：冷的空气，热的水。'],
  [21.4, 23.3, '想人少，3 月去：雪还很厚。'],
];
const HEADER = {title: '越后汤泽', place: '新潟县汤泽町', story: STORY, sheen: [60, 300, W - 120, 420]};
const LINE1 = 1440, LINE2 = 1512;
// 字色：雪地上用深蓝（白底不放白字、也不加字影），入夜后换成灯火的暖白；回环前随雪雾回到深蓝
const warmAt = t => keys(t, [[14.6, 0], [15.4, 1]]);      // 回环是直切，字色跟着画面一起切回冷色
const mixCol = (a, b, k, al = 1) => `rgba(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')},${al})`;
function palette(t) {
  const k = warmAt(t);
  return {k, head: mixCol([20, 34, 82], [255, 240, 220], k), sub: mixCol([24, 40, 92], [255, 228, 198], k, .95), narr: mixCol([20, 34, 82], [255, 232, 204], k, .96),
    accent: mixCol([52, 86, 170], [240, 180, 132], k), key: mixCol([160, 70, 8], [255, 190, 110], k)};
}
// ---- 标题上落雪：在字的横笔上沿积一层雪（越平的地方积得越厚，斜笔和笔画两头几乎不积）----
// 从字形的遮罩算一次，之后每帧贴图
function snowCaps(src, maxTh) {
  const w = src.width, h = src.height, a = src.getContext('2d').getImageData(0, 0, w, h).data;
  const on = (x, y) => a[(y * w + x) * 4 + 3] > 127;
  const edge = new Uint8Array(w * h), th = new Float32Array(w * h);
  for (let y = 1; y < h; y++) for (let x = 0; x < w; x++) if (on(x, y) && !on(x, y - 1)) edge[y * w + x] = 1;
  const near = (x, y) => edge[y * w + x] ? y : edge[(y - 1) * w + x] ? y - 1 : edge[(y + 1) * w + x] ? y + 1 : -1;
  // 1) 每个上沿点有多「平」：左右 ±10 像素里有多少点也在同一高度附近
  for (let y = 2; y < h - 1; y++) for (let x = 10; x < w - 10; x++) {
    if (!edge[y * w + x]) continue;
    let n = 0; for (let dx = -10; dx <= 10; dx++) if (near(x + dx, y) >= 0) n++;
    th[y * w + x] = maxTh * clamp((n - 9) / 10);
  }
  // 2) 沿着上沿左右平滑，雪檐两头圆圆地收掉，中间略有起伏
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const o = out.getContext('2d'), img = o.createImageData(w, h), d = img.data;
  for (let y = 2; y < h - 1; y++) for (let x = 10; x < w - 10; x++) {
    if (!edge[y * w + x]) continue;
    let sum = 0, cnt = 0;
    for (let dx = -5; dx <= 5; dx++) { const yy = near(x + dx, y); sum += yy >= 0 ? th[yy * w + x + dx] : 0; cnt++; }
    const t0 = sum / cnt * (.85 + .15 * Math.sin(x * .21) * Math.sin(x * .07));
    if (t0 < .5) continue;
    for (let k = -1; k < Math.ceil(t0); k++) {                  // 往上堆 t0 个像素（多盖住字的上沿一个像素）
      const yy = y - 1 - k; if (yy < 0) break;
      const j = (yy * w + x) * 4, f = clamp(t0 - k), shade = clamp((k + 1) / Math.max(1, t0));
      d[j] = Math.round(196 + 54 * shade); d[j + 1] = Math.round(210 + 42 * shade); d[j + 2] = Math.round(234 + 21 * shade);
      d[j + 3] = Math.max(d[j + 3], Math.round(255 * f));
    }
  }
  o.putImageData(img, 0, 0);
  return out;
}
// 标题：深蓝的字顶着积雪（入夜后字面换成暖白），不用金属反光
// 标题：雾蓝藏青的字顶着积雪（入夜后字面换成被灯照着的暖白）。字重 700，上亮下暗，
// 叠一层很淡的场景环境光，字外一圈柔光，不用金属反光，也不用硬边
const TITLE_FONT = `700 132px ${FONTS.cjk}`;
let titleCaps = null, titleMask = null; const faceLayers = {};
const TWORK = mk(860, 300), twx = TWORK.getContext('2d'), TSHEEN = mk(96, 24);
function titleCanvas(paint) {
  const c = mk(860, 300), x = c.getContext('2d');
  x.font = TITLE_FONT; if ('letterSpacing' in x) x.letterSpacing = '6px';
  paint(x); return c;
}
function titleFace(key, stops) {
  return faceLayers[key] || (faceLayers[key] = titleCanvas(x => {
    const m = x.createLinearGradient(0, TB - 112, 0, TB + 12); stops.forEach(([u, c]) => m.addColorStop(u, c));
    x.fillStyle = m; x.fillText(titleText, TX, TB);
  }));
}
function shadowOnly(img, x, y, color, blur, oy = 0) {     // 只画图形的「影子」（图形本身画在画面外）
  g.save(); g.shadowColor = color; g.shadowBlur = blur; g.shadowOffsetX = 5000; g.shadowOffsetY = oy;
  g.drawImage(img, x - 5000, y); g.restore();
}
function drawHeaderSnow(t, P) {
  titleText = HEADER.title;
  if (!titleMask) titleMask = titleCanvas(x => { x.fillStyle = '#fff'; x.fillText(titleText, TX, TB); });
  const day = clamp(1 - 2 * P.k), nite = clamp(2 * P.k - 1);
  g.save(); g.shadowColor = `rgba(244,248,255,${.8 * day})`; g.shadowBlur = 10;
  if (nite > 0) g.shadowColor = `rgba(6,10,26,${.6 * nite})`;
  const ew = text('NIIGATA', 80, 262, 26, P.accent, 500, 'left', 8);
  text(HEADER.place, 80 + ew + 22, 262, 26, P.narr, 400, 'left', 4);
  g.restore();
  const X = 74 - TX, Y = 404 - TB;
  // 字外的柔光：白天一圈淡白（从雪地里托出来），夜里一层暖色微光加很淡的深影
  if (day > 0) { shadowOnly(titleMask, X, Y, `rgba(244,248,255,${.85 * day})`, 28); shadowOnly(titleMask, X, Y, `rgba(244,248,255,${.5 * day})`, 10); }
  if (nite > 0) { shadowOnly(titleMask, X, Y, `rgba(6,10,26,${.45 * nite})`, 18, 4); shadowOnly(titleMask, X, Y, `rgba(255,186,116,${.4 * nite})`, 34); }
  // 字面
  twx.globalCompositeOperation = 'source-over'; twx.globalAlpha = 1; twx.clearRect(0, 0, 860, 300);
  if (P.k < 1) twx.drawImage(titleFace('navy', [[0, '#4d6497'], [.55, '#2a3a66'], [1, '#1c2850']]), 0, 0);
  if (P.k > 0) { twx.globalAlpha = P.k; twx.drawImage(titleFace('warm', [[0, '#fff8ec'], [.55, '#f6dcb8'], [1, '#e6bd8c']]), 0, 0); twx.globalAlpha = 1; }
  const sc = TSHEEN.getContext('2d'); sc.setTransform(1, 0, 0, -1, 0, 24); sc.drawImage(cv, 60, 300, W - 120, 420, 0, 0, 96, 24);   // 场景顶部的颜色
  twx.globalCompositeOperation = 'soft-light'; twx.globalAlpha = .28; twx.drawImage(TSHEEN, TX - 20, TB - 130, 660, 160);
  twx.globalAlpha = 1; twx.globalCompositeOperation = 'destination-in'; twx.drawImage(titleMask, 0, 0);
  twx.globalCompositeOperation = 'source-over';
  g.drawImage(TWORK, X, Y);
  if (!titleCaps) titleCaps = snowCaps(titleMask, 10);
  g.drawImage(titleCaps, X, Y);
  drawStory(t, STORY, P.narr, P.accent, nite > 0 ? `rgba(6,10,26,${.7 * nite})` : `rgba(244,248,255,${.75 * day})`);
}
// 大字和小字的柔光：只沿着字形，不铺横条。白天淡白光晕，夜里深色字影；先单独画两遍「影子」，再画字
function typoHalo(t, P) {
  const day = clamp(1 - 2 * P.k), nite = clamp(2 * P.k - 1);
  const col = nite > 0 ? `rgba(6,10,26,${.75 * nite})` : `rgba(244,248,255,${.9 * day})`;
  if (day + nite < .02) return;
  g.save(); g.translate(-5000, 0); g.shadowOffsetX = 5000; g.shadowColor = col;
  [36, 36, 18, 6].forEach(b => { g.shadowBlur = b; typo(t, P); });        // 宽的一圈像贴着字的雪雾，窄的一圈勾出字边
  g.restore();
}
function typo(t, P) {
  const S = TS();
  g.save();
  const WHITE = P.head, sub = s => text(s, W / 2, LINE2, 32, P.sub, 400, 'center', 3);
  rise(t < 3.3 ? {p: 1, out: clamp((3.3 - t) / .35)} : 0, () => {        // 第 0 帧就完整显示，当封面
    line([['66', 156, P.key, 400, -2], ['  分钟到雪国', 46, WHITE, 300, 4]], LINE1);
    sub('东京 → 越后汤泽 · 上越新干线最快');
  });
  rise(scene(t, 3.45, 5.3), () => { text('出站就是雪场', W / 2, LINE1, S.word[0], WHITE, 300, 'center', 24); sub('GALA 汤泽站 · 新干线车站直通雪场'); });
  rise(scene(t, 8.8, 10.9), () => {
    line([['10', 156, P.key, 400, -2], ['  米的雪', 46, WHITE, 300, 4]], LINE1);
    sub('一个冬天的降雪累计 · 日本气象厅平年值');
  });
  rise(scene(t, 12.0, 14.6), () => { text('天黑前 最后一趟', W / 2, LINE1, 100, WHITE, 300, 'center', 18); sub('从山顶一路滑回山脚'); });
  rise(scene(t, 17.3, 21.1), () => { text('滑完雪 泡温泉', W / 2, LINE1, 104, WHITE, 300, 'center', 20); sub('雪落进热水里，就化了'); });
  rise(scene(t, 21.5, 23.3), () => {
    line([['想人少  ', 60, WHITE, 300, 8], ['3', 120, P.key, 200, 0], ['  月去', 60, WHITE, 300, 8]], LINE1);
    sub('雪还很厚，外国游客比 1、2 月少');
  });
  g.restore();
}

// 给检查工具看的分镜
const PLAN = [
  {name: '新干线进站', from: 0, to: 3.2}, {name: '沿缆车上山', from: 3.2, to: 8.4}, {name: '山顶云海晚霞', from: 8.4, to: 10.7},
  {name: '滑回山脚', from: 10.7, to: 16.3}, {name: '露天温泉', from: 16.3, to: 21.4}, {name: '提醒与回环', from: 21.4, to: 24},
];
let camNow = 0;
function inspectAt(t) {
  t = ((t % T) + T) % T; const s = skiState(clamp(t, TD0, TD1)), cy = camY(t), Z = zoomAt(t);
  return {time: t, shot: (PLAN.find(p => t >= p.from && t < p.to) || {}).name, cameraY: cy,
    zoom: Z.z, skier: t >= 7.8 ? {screenX: (s.x - Z.fx) * Z.z + Z.ax, screenY: (s.y - cy - Z.fy) * Z.z + Z.ay, height: 186 * Z.z, moving: s.moving} : null,
    narration: (STORY.find(r => t >= r[0] && t <= r[1]) || [])[2] || null, sun: sunAt(t), night: nightAt(t)};
}

function render(t) {
  t = ((t % T) + T) % T;
  const cam = camNow = camY(t), vcam = (camY(Math.min(T - .001, t + .01)) - camY(Math.max(0, t - .01))) / .02;
  const tint = tintAt(t), sun = sunAt(t), night = nightAt(t), dusk = duskAt(t);

  // ① 中性白天的画面：远山、云海、世界长图、会动的东西
  g = fx; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H);
  if (cam < 1400) {
    const dy = cam - YTOP;
    g.drawImage(RANGE2, -40 - dy * .02, 330 - dy * .3);
    g.globalAlpha = .45; g.fillStyle = '#fff'; g.fillRect(0, 560 - dy * .3, W, 300); g.globalAlpha = 1;
    g.drawImage(RANGE1, -150, 420 - dy * .42);
    g.drawImage(CLOUDS, -300 + 220 * Math.sin(TAU * t / T), 560 - dy * .55, W + 600, 520);
  }
  g.drawImage(WORLD, 0, OY - cam);
  g.save(); g.translate(0, -cam);
  drawTracks(t); drawPowder(t, false); drawSkier(t);
  if (cam > 3200) drawTrain(t);
  drawGondola(t);
  g.restore();
  // ② 夕阳的长影 + 整体色调（只作用在已经画了东西的地方）
  mx.globalCompositeOperation = 'copy'; mx.drawImage(FRAME, 0, 0);
  g.globalCompositeOperation = 'multiply';
  if (sun > .01) { g.globalAlpha = sun; g.drawImage(SHADE, 0, OY - cam); g.globalAlpha = 1; }
  g.fillStyle = `rgb(${tint.map(Math.round)})`; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(MASK, 0, 0);
  g.globalCompositeOperation = 'source-over';

  // ③ 主画布：天空 → 画面 → 灯光、水汽、云雾、飘雪 → 文字
  g = main; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  let sunX = 300, sunY = 0;
  if (cam < 1400) {
    const dy = cam - YTOP;
    g.drawImage(verticalSprite('skyA', SKY_A), 0, -dy * .2, W, 1000);
    if (dusk > 0) { g.globalAlpha = dusk; g.drawImage(verticalSprite('skyB', SKY_B), 0, -dy * .2, W, 1000); g.globalAlpha = 1; }
    sunY = 640 + (t - 8.4) * 16 - dy * .3;
    g.globalCompositeOperation = 'lighter';
    glowAt([255, 196, 120], .9 * (1 - dusk), sunX, sunY, 520, 420, 1.5); glowAt([255, 244, 214], 1 - dusk, sunX, sunY, 86, 86, 2.2);
    if (dusk > .3) for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${(dusk - .3) * (.2 + rnd(i, 3) * .6)})`; g.fillRect(rnd(i, 1) * W, rnd(i, 2) * 620 - dy * .2, 2, 2); }
    g.globalCompositeOperation = 'source-over';
  } else { g.fillStyle = '#0a1024'; g.fillRect(0, 0, W, H); }
  g.drawImage(FRAME, 0, 0);
  g.save(); g.translate(0, -cam); drawPowder(t, true); if (cam > 3200) drawTrainSpray(t); g.globalAlpha = .5; drawSkier(t, true); g.restore();      // 人物保留一半本色，暮色里也看得清
  if (sun > .02 && cam < 2600) {                                  // 逆光的一片暖光
    g.globalCompositeOperation = 'lighter'; glowAt([255, 170, 110], .3 * sun, sunX, sunY + (cam < 1400 ? 60 : 300), 900, 700, 1.3); g.globalCompositeOperation = 'source-over';
  }
  if (cam > 4300) {
    drawWater(t, night);
    g.save(); g.translate(0, -cam); g.filter = 'brightness(.86)'; drawBathers(t); g.restore();     // 人画在水面之上，被灯照着的暖色
  }
  drawLights(t, night);
  if (cam > 4300) drawSteam(t);
  drawFog(t, tint);
  drawSnow(t, snowAt(t), vcam);
  applyZoom(zoomAt(t));                                                             // 推镜只作用于画面，文字不动
  const P = palette(t);
  g.globalAlpha = .25 + .75 * P.k; g.drawImage(verticalSprite('vig', [[0, [4, 8, 26, 120]], [.3, [4, 8, 26, 0]], [.7, [4, 8, 26, 0]], [1, [4, 8, 26, 130]]]), 0, 0, W, H);
  // 不在字下面铺横条（亮带、暗带都不要）：上方只留很淡的一层，可读性靠字形自己的柔光
  g.globalAlpha = P.k * .8; g.drawImage(verticalSprite('topscrim120', [[0, [1, 3, 12, 120]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  g.globalAlpha = 1 - P.k; g.drawImage(verticalSprite('mistTop2', [[0, [236, 242, 252, 60]], [1, [236, 242, 252, 0]]]), 0, 0, W, 360);
  g.globalAlpha = 1;
  drawHeaderSnow(t, P);
  typoHalo(t, P);
  typo(t, P);
}
boot(render);
