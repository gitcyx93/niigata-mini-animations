<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。

// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(232,238,248,.9)';       // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;
  if (sprites[key]) return sprites[key];
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(N, N), d = img.data;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(i + .5 - N / 2, j + .5 - N / 2) / (N / 2), k = (j * N + i) * 4;
    d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = Math.round(255 * Math.pow(Math.max(0, 1 - r), falloff));
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function verticalSprite(key, stops) {                 // 竖直方向的渐变条：stops = [[位置0~1, [r,g,b,a]], ...]
  if (sprites[key]) return sprites[key];
  const N = 512, c = document.createElement('canvas'); c.width = 1; c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(1, N), d = img.data;
  for (let j = 0; j < N; j++) {
    const u = (j + .5) / N; let k = 0; while (k < stops.length - 2 && u > stops[k + 1][0]) k++;
    const [u0, a] = stops[k], [u1, b] = stops[k + 1], f = clamp((u - u0) / (u1 - u0));
    for (let n = 0; n < 4; n++) d[j * 4 + n] = Math.round(a[n] + (b[n] - a[n]) * f);
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function glowAt(rgb, alpha, x, y, rx, ry = rx, falloff) {
  if (alpha <= .002) return;
  g.globalAlpha = Math.min(1, alpha); g.drawImage(radialSprite(rgb, falloff), x - rx, y - ry, rx * 2, ry * 2); g.globalAlpha = 1;
}
const hsl2rgb = (h, s, l) => {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => 255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
};

// ======== 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ========
// 繁体版（<html lang="zh-TW">）自动换成思源黑体繁体
const TC = document.documentElement.lang === 'zh-TW';
const FONTS = TC ? {
  cjk:   '"Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',
  latin: '"Sora","Source Han Sans TC",sans-serif',
} : {
  cjk:   '"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',
  latin: '"Sora","Source Han Sans SC",sans-serif',
};
// ---- 文字工具 ----
const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {
  g.font = `${weight} ${size}px ${FONTS[fam]}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function resetSpacing(c = g) { if ('letterSpacing' in c) c.letterSpacing = '0px'; }
function measure(s, size, weight = 400, spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  setFont(size, weight, spacing, fam); const w = g.measureText(s).width - spacing; resetSpacing(); return w;
}
function text(s, x, y, size, color, weight = 400, align = 'left', spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  const w = measure(s, size, weight, spacing, fam);
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  setFont(size, weight, spacing, fam); g.textAlign = 'left'; g.fillStyle = color; g.fillText(s, left, y); resetSpacing();
  return w;
}
// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动
// parts: [文字, 字号, 颜色, 字重, 字距, 最终值]
function line(parts, y) {
  const ws = parts.map(([s, size, , wt = 400, sp = 0, slot]) => measure(slot || s, size, wt, sp));
  let x = (W - ws.reduce((a, b) => a + b, 0)) / 2;
  parts.forEach(([s, size, color, wt = 400, sp = 0, slot], i) => {
    text(s, slot ? x + ws[i] : x, y, size, color, wt, slot ? 'right' : 'left', sp); x += ws[i];
  });
  return ws.reduce((a, b) => a + b, 0);
}
function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);
  if (age > dur) return 0;
  return {p: from > to && t < to ? 1 : easeOut(age / .55), out: clamp((dur - age) / .35), age};
}
function rise(s, draw) {
  if (!s) return;
  g.save(); g.globalAlpha = s.out * s.p; g.translate(0, (1 - s.p) * 40); draw(); g.restore();
}

// ---- 字号和字重：极简风格，靠大小和粗细拉开层次 ----
// [字号, 字重, 字距]
const TS = () => ({num: [140, 200, -4], name: [68, 300, 8], word: [112, 200, 30], unit: [40, 300, 2], sub: [30, 300, 2]});

// ======== 左上角：讲故事的小字 ========
// 小字是「背景知识」：比大字小，前面一根竖细线；一个字一个字慢慢浮现，说完淡出。
// 字号偏大、中等字重，一律带柔和的深色字影，叠在任何背景上都看得清、也有一点立体感。一句太长时自动缩小字号。
// story: [[开始秒, 结束秒, 一句话], ...]，一次只放一行
const STORY_SHADOW = 'rgba(4,6,16,.85)';
function drawStory(t, story, color = NARRATION, bar = TYPE.accent, shadow = STORY_SHADOW) {
  story.forEach(([from, to, s]) => {
    if (t < from || t > to) return;
    const out = clamp((to - t) / .5), y = 480;
    let size = 38; while (size > 30 && measure(s, size, 500, 1.5) > 900) size--;
    g.globalAlpha = out * clamp((t - from) / .3);
    g.fillStyle = bar; g.fillRect(80, y - 33, 3, 44);          // 竖细线：提示「这是旁白」
    setFont(size, 500, 1.5); g.textAlign = 'left';
    g.shadowColor = shadow || STORY_SHADOW; g.shadowBlur = 9; g.shadowOffsetY = 1;
    let x = 102;
    [...s].forEach((c, i) => {
      const p = clamp((t - from - i * .05) / .45);           // 每个字晚 0.05 秒出现
      if (p > 0) { g.globalAlpha = ease(p) * out; g.fillStyle = color; g.fillText(c, x, y + 8 * (1 - ease(p))); g.fillText(c, x, y + 8 * (1 - ease(p))); }   // 叠两次，字影更实
      x += g.measureText(c).width;
    });
    g.globalAlpha = 1; g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; resetSpacing();
  });
}

// ======== 标题：镜面金属字（全系列统一）========
//  - 底色是接近白色的哑光银，从上到下平滑地由亮变暗（不要中间一道暗色「地平线」，在大字上会看成一条横线）
//  - 字面映出此刻的场景：截一块画面、上下翻转、缩到很小（相当于金属表面的模糊），以「柔光」叠上去，是一层光泽而不是清晰的倒影
//  - 倒角：上沿一道亮边、下沿一道暗边，让字有厚度；字外一圈外浮雕；下面一层很轻的投影
//  - 被场景里的光照出一块柔和的高光，位置、颜色跟着光源走，亮度有上限
// 不变的几层只画一次；每帧只在一张小画布上贴几次图
const TX = 30, TB = 190;                 // 标题在缓存画布里的位置
const titleLayers = {};
let titleText = '';
function titleLayer(key, paint) {
  if (!titleLayers[key]) {
    const c = document.createElement('canvas'); c.width = 860; c.height = 300;
    const x = c.getContext('2d');
    x.font = `800 132px ${FONTS.cjk}`; if ('letterSpacing' in x) x.letterSpacing = '6px';
    paint(x); titleLayers[key] = c;
  }

}
const titleWork = document.createElement('canvas'); titleWork.width = 860; titleWork.height = 300;
const mask = () => titleLayer('mask', x => { x.fillStyle = '#fff'; x.fillText(titleText, TX, TB); });
const titleShadow = () => titleLayer('shadow', x => {
  x.shadowColor = 'rgba(0,0,0,.42)'; x.shadowBlur = 26; x.shadowOffsetY = 6; x.shadowOffsetX = 5000; x.fillStyle = '#000'; x.fillText(titleText, TX - 5000, TB);
});
const silver = () => titleLayer('silver', x => {
  const top = TB - 112, m = x.createLinearGradient(0, top, 0, TB + 12);
  m.addColorStop(0, '#f8fafd'); m.addColorStop(.55, '#dce2eb'); m.addColorStop(1, '#b2bdcd');
  x.fillStyle = m; x.fillText(titleText, TX, TB);

const bevel = () => titleLayer('bevel', x => {
  x.fillStyle = 'rgba(255,255,255,.85)'; x.fillText(titleText, TX, TB - 2);          // 上沿亮边
  x.globalCompositeOperation = 'destination-out'; x.fillText(titleText, TX, TB);
  x.globalCompositeOperation = 'source-over'; x.fillStyle = 'rgba(18,26,44,.45)'; x.fillText(titleText, TX, TB + 2.5);   // 下沿暗边
  x.globalCompositeOperation = 'destination-in'; x.fillText(titleText, TX, TB);
});
// 外浮雕：把字形模糊一下当成高度，按「光从左上方照下来」算字外一圈的明暗：
// 左上方贴着字边一道细亮边，右下方一道柔和的暗边，字像从背景里微微凸出来。字面本身不变。
// 只在第一次用到时算一次，之后每帧贴图
function blurF(a, w, h, r) {                   // 三次盒式模糊 ≈ 高斯模糊
  const tmp = new Float32Array(w * h), n = 2 * r + 1;
  for (let k = 0; k < 3; k++) {
    for (let y = 0; y < h; y++) {
      let acc = 0; const o = y * w;
      for (let x = -r; x <= r; x++) acc += a[o + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc / n; acc += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) { a[y * w + x] = acc / n; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
  }

}
const RELIEF = {r: 2, k: 7, hi: .55, lo: .85};     // 坡宽、坡度、亮边和暗边的强度
const relief = () => titleLayer('relief', x => {
  const w = 860, h = 300, m = mask().getContext('2d').getImageData(0, 0, w, h).data;
  const Hm = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) Hm[i] = m[i * 4 + 3] / 255;
  blurF(Hm, w, h, RELIEF.r);
  const L = [-.5, -.7, .5], ll = Math.hypot(...L); L[0] /= ll; L[1] /= ll; L[2] /= ll;
  const img = x.createImageData(w, h), d = img.data;
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    const i = y * w + xx, out = 1 - m[i * 4 + 3] / 255;
    if (!out) continue;
    const gx = (Hm[i + 1] - Hm[i - 1]) / 2 * RELIEF.k, gy = (Hm[i + w] - Hm[i - w]) / 2 * RELIEF.k;
    const sh = (-gx * L[0] - gy * L[1] + L[2]) / Math.hypot(gx, gy, 1) - L[2];
    if (Math.abs(sh) < .004) continue;
    const j = i * 4, v = Math.min(1, Math.abs(sh) * 1.6);
    if (sh > 0) { d[j] = d[j + 1] = d[j + 2] = 255; d[j + 3] = v * RELIEF.hi * out * 255; }
    else { d[j] = 6; d[j + 1] = 8; d[j + 2] = 14; d[j + 3] = v * RELIEF.lo * out * 255; }
  }

});
const sheen = document.createElement('canvas'); sheen.width = 96; sheen.height = 24;
// 标题区：NIIGATA + 地名 / 金属大标题 / 讲故事的小字
// header = {title, place, story, sheen: [x, y, w, h]（字面映出的那块画面，只取天空，不要深色的山）,
//           可选 storyColor / accent：小字和 NIIGATA、竖线的颜色（固定值或 t => 颜色）；
//           storyShadow: 旁白小字的字影颜色（背景亮时用）；
//           reflect: false 关掉字面的反射和高光（如冬季标题上已经有落雪，再反光就太花）}
// L = {light: 光的强度, lc: [r,g,b] 光的颜色, x: 光的水平位置}
function drawHeader(t, L, header) {
  titleText = header.title;
  const pick = v => typeof v === 'function' ? v(t) : v;      // 颜色可以是固定值，也可以随时间变（如跟着故事由冷变暖）
  const narr = pick(header.storyColor) || NARRATION, accent = pick(header.accent) || TYPE.accent;
  const ew = text('NIIGATA', 80, 262, 26, accent, 500, 'left', 8);
  text(header.place, 80 + ew + 22, 262, 26, narr, 400, 'left', 4);
  const X = 74 - TX, Y = 404 - TB;
  g.drawImage(titleShadow(), X, Y);
  g.drawImage(relief(), X, Y);
  const w = titleWork.getContext('2d');
  w.setTransform(1, 0, 0, 1, 0, 0); w.globalCompositeOperation = 'source-over'; w.globalAlpha = 1; w.clearRect(0, 0, 860, 300);
  w.drawImage(silver(), 0, 0);
  const reflect = header.reflect !== false;
  if (reflect) {                                             // 字面映出场景的光泽
    const sc = sheen.getContext('2d');
    sc.setTransform(1, 0, 0, -1, 0, 24);
    sc.drawImage(cv, ...header.sheen, 0, 0, 96, 24);
    w.imageSmoothingEnabled = true; w.imageSmoothingQuality = 'high';
    w.globalCompositeOperation = 'soft-light'; w.drawImage(sheen, TX - 20, TB - 130, 660, 160);
    w.globalCompositeOperation = 'lighter'; w.globalAlpha = .35; w.drawImage(sheen, TX - 20, TB - 130, 660, 160);
    w.globalAlpha = 1;
  }
  if (reflect && L.light > .03) {                                       // 高光：跟着光源的位置和颜色
    const hx = TX + clamp(L.x / W) * 600;
    w.globalCompositeOperation = 'source-over'; w.globalAlpha = Math.min(.5, L.light * .38);
    w.drawImage(radialSprite(L.lc, 1.3), hx - 280, TB - 190, 560, 240);
    w.globalAlpha = 1;
  }
  w.globalCompositeOperation = 'destination-in'; w.drawImage(mask(), 0, 0);
  w.globalCompositeOperation = 'source-over';
  w.drawImage(bevel(), 0, 0);
  g.drawImage(titleWork, X, Y);
  drawStory(t, header.story, narr, accent, pick(header.storyShadow));
}
// 文字层底下的压暗：上面托住标题，下面托住大字（y0 ~ y0+h 的中间最暗）
function scrims(bandY = 1300, bandH = 320, top = 204, band = 158) {
  g.drawImage(verticalSprite('topscrim' + top, [[0, [1, 3, 12, top]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  g.drawImage(verticalSprite('band' + band, [[0, [1, 3, 12, 0]], [.5, [1, 3, 12, band]], [1, [1, 3, 12, 0]]]), 0, bandY, W, bandH);
}

// ======== 播放和导出 ========
// render(t) 必须是确定性的：同一个 t 永远画出同一帧（逐帧录制靠这个）。?record 时不自动播放，等录制脚本调用。
async function loadFonts() {
  if (typeof FONT_DATA === 'undefined' || !window.FontFace) return;
  await Promise.all(FONT_DATA.map(([family, weight, range, b64]) => {
    const f = new FontFace(family, `url(data:font/woff2;base64,${b64})`, {weight, unicodeRange: range});
    document.fonts.add(f); return f.load();
  }));
}
// 视频从第几秒开始（循环是无缝的，从哪一秒开始都是完整的一圈）。页面里可以写 const START = 11.9;
// 把高潮放到视频的第一帧，不需要加速或压缩任何画面。网页播放和 record.js 导出都从这里开始。
function boot(render) {
  const start0 = typeof START === 'number' ? START : 0;
  window.render = render;
  window.LOOP_SECONDS = T;
  window.START_SECONDS = start0;
  const ready = loadFonts().catch(() => {});
  if (!params.has('record')) {
    ready.then(() => {
      const start = performance.now();
      const tick = () => { render(start0 + (performance.now() - start) / 1000); requestAnimationFrame(tick); };
      tick();
    });
  } else ready.then(() => { render(start0); window.READY = true; });
}
/*SERIES-END*/

<script>
// 越后汤泽（新潟县汤泽町）—— 冬季，独立新稿「从云上滑进温泉」。
// 一张竖着的长画卷（山顶在上，温泉在下），镜头只做上下运动，一镜到底：
//   新干线进站 → 沿缆车升上山，穿过云层 → 山顶云海晚霞 → 跟着滑雪的人一路滑回山脚 → 落进夜里的露天温泉 → 热气漫上来，接回开头的雪雾。
// 光线跟着故事走：阴天的雪 → 云上的晚霞 → 蓝调的黄昏 → 亮灯的夜。
// 做法：世界先按「中性的白天」画好一张长图，每帧再整体乘上一层随时间变化的色调，夕阳的长影是另一张图；灯光最后叠加。
// render(t) 是确定性的：同一个 t 永远画出同一帧。

const T = 24;
const OY = 860, WH = 7660;                 // 长图覆盖的世界范围（y 向下）
const RIDGE = 1120, BASE = 5060;           // 山脊、山脚
const YS = 4270, YTOP = 200, YO = 5720;    // 镜头三个停靠点：车站、山顶、温泉
const smoother = x => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10); };
const keys = (t, ks) => {                  // 关键帧之间平滑过渡：[[时间, 值], ...]，值可以是数或数组
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) {
    const k = ease(clamp((t - ks[i - 1][0]) / (ks[i][0] - ks[i - 1][0]))), a = ks[i - 1][1], b = ks[i][1];
    return Array.isArray(a) ? a.map((v, n) => lerp(v, b[n], k)) : lerp(a, b, k);
  }
  return ks[ks.length - 1][1];
};

// ======== 地形 ========
const ridgeY = x => RIDGE + 10 - 70 * Math.exp(-Math.pow((x - 700) / 400, 2)) + 9 * Math.sin(x / 97 + 1);
const slopeU = y => clamp((y - RIDGE) / (BASE - RIDGE));
function pisteX(y) {                        // 雪道中线
  const u = slopeU(y);
  let x = 430 + 120 * Math.sin(y / 410 + .6) + 45 * Math.sin(y / 163);
  x = lerp(640, x, ease(clamp(u / .14)));
  return lerp(x, 470, ease(clamp((u - .88) / .12)));
}
const pisteW = y => 235 + 35 * Math.sin(y / 530) + 60 * ease(clamp((slopeU(y) - .9) / .1));
const G0 = [880, 5150], G1 = [820, 1215];   // 缆车线：山脚站 → 山顶站
const gondX = y => lerp(G0[0], G1[0], (G0[1] - y) / (G0[1] - G1[1]));

// ======== 滑雪的人：路线和时间 ========
const TD0 = 10.7, TD1 = 16.3, SKI0 = 1150, SKI1 = 5120;
function skiE(u) {                          // 起步加速、匀速、最后刹停
  u = clamp(u); const a = .18, d = .12, v = 1 / (1 - a / 2 - d / 2);
  return u < a ? v * u * u / (2 * a) : u < 1 - d ? v * (u - a / 2) : 1 - v * (1 - u) * (1 - u) / (2 * d);
}
const skiY = t => SKI0 + (SKI1 - SKI0) * skiE((t - TD0) / (TD1 - TD0));
const TURN = 118;
function skiAmp(y) { return Math.min(150, pisteW(y) - 80) * ease(clamp((y - SKI0) / 320)) * ease(clamp((SKI1 - y) / 380)); }
const skiX = y => pisteX(y) + skiAmp(y) * Math.sin((y - SKI0) / TURN);
function skiState(t) {
  const y = skiY(t), x = skiX(y), dx = (skiX(y + 3) - skiX(y - 3)) / 6;
  const curv = (skiX(y + 14) - 2 * x + skiX(y - 14)) / 196;
  const moving = t > TD0 && t < TD1;
  return {x, y, dx, lean: moving ? clamp(curv * 46, -.52, .52) : 0, moving};
}

// ======== 镜头 ========
const TD = 15.5, TO = 18.3;
const camFollow = t => skiY(t) - (980 + 90 * ease(clamp((t - TD0) / 2)));
const CAM_P0 = camFollow(TD), CAM_V0 = (camFollow(TD) - camFollow(TD - .002)) / .002;
function camY(t) {
  if (t < 3.2) return YS - 40 * ease(t / 3.2);
  if (t < 8.4) return lerp(YS - 40, YTOP, smoother((t - 3.2) / 5.2));
  if (t < TD0) return YTOP - 30 * ease((t - 8.4) / (TD0 - 8.4));
  if (t < TD) return camFollow(t);
  if (t < TO) {                             // 人在山脚刹停，镜头带着原来的速度继续往下，落到温泉
    const d = TO - TD, u = (t - TD) / d, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * CAM_P0 + (u3 - 2 * u2 + u) * CAM_V0 * d + (-2 * u3 + 3 * u2) * YO;
  }
  return YO + 26 * ease((t - TO) / (T - TO));
}

// ======== 光线时间表 ========
const tintAt = t => keys(t, [[5.3, [132, 152, 196]], [7.3, [250, 200, 170]], [10.4, [244, 176, 152]], [13.0, [128, 132, 190]], [15.6, [78, 94, 158]], [18, [54, 68, 126]]]);
const sunAt = t => keys(t, [[5.6, 0], [7.2, 1], [10.6, .9], [13.2, 0]]);
const nightAt = t => keys(t, [[0, .34], [5, .34], [6.5, 0], [11.5, 0], [14.5, .6], [17.5, 1]]);
const snowAt = t => keys(t, [[0, 1], [4.6, 1], [6.2, 0], [13.2, 0], [16, .55], [18, .75], [T, .75]]);
const duskAt = t => keys(t, [[10.2, 0], [13.4, 1]]);          // 天空：晚霞 → 夜

// ======== 树 ========
function tree(c, x, y, h, seed, snowCol = '#f2f6fd') {
  const n = h > 260 ? 6 : 4, w = h * (.25 + rnd(seed, 3) * .05);
  c.fillStyle = '#3a3140'; c.fillRect(x - h * .022, y - h * .16, h * .044, h * .17);
  for (let i = 0; i < n; i++) {
    const k = i / n, by = y - h * (.1 + k * .78), hw = w * (1 - k * .82), th = h * (.34 - k * .1);
    const sag = th * .16, j = (rnd(seed, i) - .5) * hw * .2;
    c.fillStyle = i % 2 ? '#1f3350' : '#1a2b47';
    c.beginPath(); c.moveTo(x + j * .3, by - th);
    c.quadraticCurveTo(x - hw * .35, by - th * .45, x - hw + j, by);
    c.quadraticCurveTo(x - hw * .4, by + sag, x, by + sag * .4);
    c.quadraticCurveTo(x + hw * .45, by + sag, x + hw + j, by - th * .04);
    c.quadraticCurveTo(x + hw * .32, by - th * .5, x + j * .3, by - th); c.fill();
    // 枝上的积雪：盖住这一层的上半边，下沿不齐
    c.fillStyle = snowCol;
    c.beginPath(); c.moveTo(x + j * .3, by - th - h * .012);
    c.quadraticCurveTo(x - hw * .36, by - th * .48, x - hw * .96 + j, by - th * .03);
    c.quadraticCurveTo(x - hw * .55, by - th * .2, x - hw * .3, by - th * .1);
    c.quadraticCurveTo(x - hw * .05, by - th * .32, x + hw * .2, by - th * .2);
    c.quadraticCurveTo(x + hw * .45, by - th * .3, x + hw * .62 + j, by - th * .2);
    c.quadraticCurveTo(x + hw * .26, by - th * .56, x + j * .3, by - th - h * .012); c.fill();
  }
}

// ======== 世界长图（中性白天）和夕阳长影 ========
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const WORLD = mk(W, WH - OY), SHADE = mk(W, BASE + 260 - OY);
const LIGHTS = [];          // 窗灯：[x, y, w, h, 组]
const GLOWS = [];           // 柔光：[x, y, 半径, 强度]
const TREES = [];
const POOL = {x: 540, y: 6790, rx: 430, ry: 235};
const TRAIN_Y = 5494, FENCE_Y = 6260;
(function buildWorld() {
  const o = WORLD.getContext('2d'), s = SHADE.getContext('2d');
  o.translate(0, -OY); s.translate(0, -OY);
  const terrain = c => { c.beginPath(); c.moveTo(0, ridgeY(0)); for (let x = 0; x <= W; x += 12) c.lineTo(x, ridgeY(x)); c.lineTo(W, WH); c.lineTo(0, WH); c.closePath(); };
  const blob = (c, rgb, a, x, y, rx, ry) => { c.globalAlpha = a; c.drawImage(radialSprite(rgb, 1.4), x - rx, y - ry, rx * 2, ry * 2); c.globalAlpha = 1; };
  o.save(); terrain(o); o.clip();
  const gr = o.createLinearGradient(0, RIDGE, 0, BASE); gr.addColorStop(0, '#f3f6fc'); gr.addColorStop(1, '#e4ebf7');
  o.fillStyle = gr; o.fillRect(0, OY, W, WH);
  for (let i = 0; i < 170; i++) {                       // 雪面的起伏
    const y = RIDGE + rnd(i, 1) * (BASE - RIDGE + 200), x = rnd(i, 2) * W;
    blob(o, i % 3 ? [176, 195, 230] : [255, 255, 255], .2 + rnd(i, 3) * .22, x, y, 140 + rnd(i, 4) * 300, 50 + rnd(i, 5) * 90);
  }
  // 雪道：压过雪的一条亮带，上面有压雪车留下的细纹
  o.beginPath(); for (let y = RIDGE - 40; y <= BASE + 160; y += 20) o.lineTo(pisteX(y) - pisteW(y), y);
  for (let y = BASE + 160; y >= RIDGE - 40; y -= 20) o.lineTo(pisteX(y) + pisteW(y), y);
  o.fillStyle = 'rgba(255,255,255,.6)'; o.fill();
  o.lineWidth = 2; o.strokeStyle = 'rgba(150,172,216,.2)';
  for (let k = -9; k <= 9; k++) { o.beginPath(); for (let y = RIDGE + 30; y <= BASE; y += 24) o.lineTo(pisteX(y) + k * pisteW(y) / 10.5, y); o.stroke(); }
  o.lineWidth = 3; o.strokeStyle = 'rgba(128,152,205,.3)';         // 前面的人留下的雪痕
  for (let k = 0; k < 5; k++) { o.beginPath(); for (let y = RIDGE + 60 + k * 37; y <= BASE - 40; y += 10) o.lineTo(pisteX(y) + (pisteW(y) - 60) * .8 * Math.sin(y / (96 + k * 17) + k * 2.1) * ease(clamp((BASE - y) / 500)), y); o.stroke(); }
  o.restore();

  // 树：雪道和缆车线两边
  for (let gy = RIDGE + 46; gy < BASE + 70; gy += 44) for (let gx = -20; gx < W + 40; gx += 56) {
    const id = gx * 7.13 + gy * 3.7, x = gx + (rnd(id, 1) - .5) * 52, y = gy + (rnd(id, 2) - .5) * 40, u = slopeU(y);
    if (Math.abs(x - pisteX(y)) < pisteW(y) + 18 + rnd(id, 3) * 46) continue;
    if (Math.abs(x - gondX(y)) < 56) continue;
    if (rnd(id, 4) > .34 + u * 1.4) continue;                       // 越靠近山顶树越稀
    if (y > BASE - 40 && x > 120 && x < 990) continue;               // 山脚留给车站
    TREES.push([x, y, (70 + rnd(id, 5) * 95) * (.62 + .62 * u), id]);
  }

    const x = P.x + (rnd(i, seedN % 7 + 82) - .5) * P.rx * 1.6, y = P.y + (rnd(i, seedN % 5 + 90) - .5) * P.ry * 1.4;
    g.strokeStyle = `rgba(220,236,250,${.5 * (1 - ph)})`; g.lineWidth = 2;
    g.beginPath(); g.ellipse(x, y - camNow, 6 + ph * 34, 2 + ph * 11, 0, 0, TAU); g.stroke();
  }
  g.restore();
}
function drawSteam(t) {
  const P = POOL, sp = radialSprite([200, 214, 240], 1.25);
  for (let i = 0; i < 46; i++) {
    const cyc = 4 + (i % 4), a = fract(t / T * cyc + rnd(i, 91));
    const x = P.x + (rnd(i, 92) - .5) * P.rx * 1.9 + Math.sin(TAU * a + i) * 40 + a * 60, y = P.y - 30 - a * 640 + (rnd(i, 93) - .5) * 200;
    const r = 110 + a * 230;
    g.globalAlpha = .25 * Math.sin(Math.PI * Math.pow(a, .7)); g.drawImage(sp, x - r, y - camNow - r * .8, r * 2, r * 1.6);
  }
  g.globalAlpha = 1;
}
// ---- 灯 ----
function drawLights(t, night) {
  if (night < .02) return;
  g.globalCompositeOperation = 'lighter';
  LIGHTS.forEach(([x, y, w, h, grp], i) => {
    const fy = y - camNow; if (fy > H + 80 || fy + h < -80) return;
    const k = grp === 2 ? Math.max(night, 0) * (.85 + .15 * Math.sin(TAU * 9 * t / T)) : grp === 1 ? .4 + night : night * (.7 + .3 * rnd(i, 7));
    g.fillStyle = `rgba(255,${grp === 2 ? 190 : 208},${grp === 2 ? 110 : 140},${Math.min(1, k * .9)})`; g.fillRect(x, fy, w, h);
    glowAt([255, 200, 130], .28 * k, x + w / 2, fy + h / 2, w * 1.5 + 30, h * 1.5 + 30);
  });
  GLOWS.forEach(([x, y, r, a]) => { const fy = y - camNow; if (fy > -r && fy < H + r) glowAt([255, 196, 124], a * night, x, fy, r); });
  if (night > .3) {                                       // 灯笼照亮的一片雪和水汽
    glowAt([255, 176, 96], .62 * night, 150, 6465 - camNow, 520, 400, 1.5);
    glowAt([255, 190, 120], .16 * night, 540, 6500 - camNow, 900, 520, 1.2);
  }
  cabins(t, (x, y) => glowAt([255, 214, 150], .5 * night, x, y + 44 - camNow, 34, 26));
  g.save(); g.translate(0, -camNow); trainLights(t, night); g.restore();
  g.globalCompositeOperation = 'source-over';
}
// ---- 飘雪 ----
function drawSnow(t, k, vcam) {
  if (k < .02) return;
  g.lineCap = 'round';
  for (let i = 0; i < 300; i++) {
    const L = i % 3, par = .3 + L * .25, cyc = 3 + L * 2 + Math.floor(rnd(i, 3) * 2);
    const y = fract(rnd(i, 2) + cyc * t / T - camNow * par / 2100) * 2100 - 90;
    const x = fract(rnd(i, 1) + .04 * Math.sin(TAU * (2 * t / T + rnd(i, 4))) + (2 + L) * t / T) * 1240 - 80;
    const r = (1.4 + L * 1.2) * (.7 + rnd(i, 5) * .7), st = clamp(vcam * par * .022, -60, 60);
    g.strokeStyle = `rgba(240,246,255,${k * (.45 + L * .2)})`; g.lineWidth = r * 2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + .5, y - st + .5); g.stroke();
  }
}
// ---- 云雾：上山时穿过云层，循环首尾的雪雾/热气 ----
const FOG = mk(W + 800, 700);
(function () {
  const x = FOG.getContext('2d');
  for (let i = 0; i < 70; i++) { const r = 160 + rnd(i, 101) * 220; x.globalAlpha = .34; x.drawImage(radialSprite([255, 255, 255], 1.2), rnd(i, 102) * (W + 800 - r * 2), rnd(i, 103) * (700 - r * 1.2), r * 2, r * 1.2); }
})();
const FOGC = 3000;
function drawFog(t, tint) {
  const d = Math.exp(-Math.pow((camNow + 960 - FOGC) / 950, 2)) * (t < 9 ? .95 : .42);
  if (d > .02) {
    const col = tint.map(v => Math.round(Math.min(255, v * 1.12 + 26)));
    g.globalAlpha = d * .8; g.fillStyle = `rgb(${col})`; g.fillRect(0, 0, W, H);
    g.globalAlpha = d;
    for (let k = 0; k < 4; k++) {                            // 一团团云从镜头前掠过（比山移动得快）
      const y = fract((FOGC + k * 620 - camNow * 1.5) / 2600) * 2600 - 500, dx = -400 + 300 * Math.sin(TAU * (t / T + k * .23));
      g.drawImage(FOG, dx - 200, y, W + 800, 700);
    }
    g.globalAlpha = 1;
  }
  const loopFog = Math.max(1 - ease(clamp(t / .95)), ease(clamp((t - (T - 1.15)) / 1.15)));
  if (loopFog > .003) {
    g.globalAlpha = loopFog; g.fillStyle = 'rgb(150,168,206)'; g.fillRect(0, 0, W, H);
    g.globalAlpha = loopFog * (1 - loopFog) * 2.4;
    g.drawImage(FOG, -300 + 200 * Math.sin(t * 1.3), 300 - 500 * (t < 2 ? t : t - T), W + 800, 1400);
    g.globalAlpha = 1;
  }
}

// ======== 文字 ========
const STORY = [
  [0.5, 3.4, '川端康成《雪国》的舞台，就在这里。'],
  [3.8, 8.1, '车站连着雪场，出了检票口就能上山。'],
  [8.6, 10.9, '一个冬天，这里的降雪累计超过 10 米。'],
  [11.4, 16.0, '天黑之前的最后一趟，一路滑回山脚。'],
  [16.9, 21.1, '滑完雪，泡进露天温泉：冷的空气，热的水。'],
  [21.4, 23.3, '想人少，3 月去：雪还很厚。'],
];
const HEADER = {title: '越后汤泽', place: '新潟县汤泽町', story: STORY, sheen: [60, 300, W - 120, 420]};
const LINE1 = 1440, LINE2 = 1512;
function typo(t) {
  const S = TS();
  g.save(); g.shadowColor = 'rgba(8,14,44,.6)'; g.shadowBlur = 22; g.shadowOffsetY = 2;
  const sub = s => text(s, W / 2, LINE2, 32, 'rgba(238,243,252,.92)', 400, 'center', 3);
  rise(scene(t, 0.9, 3.5), () => {
    line([['66', S.num[0], TYPE.gold, S.num[1], S.num[2]], ['  分钟到雪国', 46, WHITE, 300, 4]], LINE1);
    sub('东京 → 越后汤泽 · 上越新干线最快');
  });
  rise(scene(t, 4.3, 8.0), () => { text('出站就是雪场', W / 2, LINE1, S.word[0], WHITE, 300, 'center', 24); sub('GALA 汤泽站 · 新干线车站直通雪场'); });
  rise(scene(t, 8.8, 10.9), () => {
    line([['10', S.num[0], TYPE.gold, S.num[1], S.num[2]], ['  米的雪', 46, WHITE, 300, 4]], LINE1);
    sub('一个冬天的降雪累计 · 日本气象厅平年值');
  });
  rise(scene(t, 17.3, 21.1), () => { text('滑完雪 泡温泉', W / 2, LINE1, 104, WHITE, 300, 'center', 20); sub('雪落进热水里，就化了'); });
  rise(scene(t, 21.5, 23.3), () => {
    line([['想人少  ', 60, WHITE, 300, 8], ['3', 120, TYPE.gold, 200, 0], ['  月去', 60, WHITE, 300, 8]], LINE1);
    sub('雪还很厚，外国游客比 1、2 月少');
  });
  g.restore();
}

// 给检查工具看的分镜
const PLAN = [
  {name: '新干线进站', from: 0, to: 3.2}, {name: '沿缆车上山', from: 3.2, to: 8.4}, {name: '山顶云海晚霞', from: 8.4, to: 10.7},
  {name: '滑回山脚', from: 10.7, to: 16.3}, {name: '露天温泉', from: 16.3, to: 21.4}, {name: '提醒与回环', from: 21.4, to: 24},
];
let camNow = 0;
function inspectAt(t) {
  t = ((t % T) + T) % T; const s = skiState(clamp(t, TD0, TD1)), cy = camY(t);
  return {time: t, shot: (PLAN.find(p => t >= p.from && t < p.to) || {}).name, cameraY: cy,
    skier: t >= 7.8 ? {screenX: s.x, screenY: s.y - cy, moving: s.moving} : null,
    narration: (STORY.find(r => t >= r[0] && t <= r[1]) || [])[2] || null, sun: sunAt(t), night: nightAt(t)};
}

function render(t) {
  t = ((t % T) + T) % T;
  const cam = camNow = camY(t), vcam = (camY(Math.min(T - .001, t + .01)) - camY(Math.max(0, t - .01))) / .02;
  const tint = tintAt(t), sun = sunAt(t), night = nightAt(t), dusk = duskAt(t);

  // ① 中性白天的画面：远山、云海、世界长图、会动的东西
  g = fx; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H);
  if (cam < 1400) {
    const dy = cam - YTOP;
    g.drawImage(RANGE2, -40 - dy * .02, 330 - dy * .3);
    g.globalAlpha = .45; g.fillStyle = '#fff'; g.fillRect(0, 560 - dy * .3, W, 300); g.globalAlpha = 1;
    g.drawImage(RANGE1, -150, 420 - dy * .42);
    g.drawImage(CLOUDS, -300 + 220 * Math.sin(TAU * t / T), 560 - dy * .55, W + 600, 520);
  }
  g.drawImage(WORLD, 0, OY - cam);
  g.save(); g.translate(0, -cam);
  drawTracks(t); drawPowder(t); drawSkier(t);
  if (cam > 3200) drawTrain(t);
  drawGondola(t);
  if (cam > 4600) drawBathers(t);
  g.restore();
  // ② 夕阳的长影 + 整体色调（只作用在已经画了东西的地方）
  mx.globalCompositeOperation = 'copy'; mx.drawImage(FRAME, 0, 0);
  g.globalCompositeOperation = 'multiply';
  if (sun > .01) { g.globalAlpha = sun; g.drawImage(SHADE, 0, OY - cam); g.globalAlpha = 1; }
  g.fillStyle = `rgb(${tint.map(Math.round)})`; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(MASK, 0, 0);
  g.globalCompositeOperation = 'source-over';

  // ③ 主画布：天空 → 画面 → 灯光、水汽、云雾、飘雪 → 文字
  g = main; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  let sunX = 300, sunY = 0;
  if (cam < 1400) {
    const dy = cam - YTOP;
    g.drawImage(verticalSprite('skyA', SKY_A), 0, -dy * .2, W, 1000);
    if (dusk > 0) { g.globalAlpha = dusk; g.drawImage(verticalSprite('skyB', SKY_B), 0, -dy * .2, W, 1000); g.globalAlpha = 1; }
    sunY = 640 + (t - 8.4) * 16 - dy * .3;
    g.globalCompositeOperation = 'lighter';
    glowAt([255, 196, 120], .9 * (1 - dusk), sunX, sunY, 520, 420, 1.5); glowAt([255, 244, 214], 1 - dusk, sunX, sunY, 86, 86, 2.2);
    if (dusk > .3) for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${(dusk - .3) * (.2 + rnd(i, 3) * .6)})`; g.fillRect(rnd(i, 1) * W, rnd(i, 2) * 620 - dy * .2, 2, 2); }
    g.globalCompositeOperation = 'source-over';
  } else { g.fillStyle = '#0a1024'; g.fillRect(0, 0, W, H); }
  g.drawImage(FRAME, 0, 0);
  g.save(); g.translate(0, -cam); g.globalAlpha = .5; drawSkier(t, true); g.restore();      // 人物保留一半本色，暮色里也看得清
  if (sun > .02 && cam < 2600) {                                  // 逆光的一片暖光
    g.globalCompositeOperation = 'lighter'; glowAt([255, 170, 110], .3 * sun, sunX, sunY + (cam < 1400 ? 60 : 300), 900, 700, 1.3); g.globalCompositeOperation = 'source-over';
  }
  if (cam > 4300) drawWater(t, night);
  drawLights(t, night);
  if (cam > 4300) drawSteam(t);
  drawFog(t, tint);
  drawSnow(t, snowAt(t), vcam);
  g.drawImage(verticalSprite('vig', [[0, [4, 8, 26, 120]], [.3, [4, 8, 26, 0]], [.7, [4, 8, 26, 0]], [1, [4, 8, 26, 130]]]), 0, 0, W, H);
  scrims(1290, 330, 140, 64);
  drawHeader(t, {light: sun * .8, lc: [255, 206, 150], x: sunX}, HEADER);
  typo(t);
}
boot(render);
</script>
