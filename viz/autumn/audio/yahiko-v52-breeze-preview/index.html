<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弥彦 · 前十秒微风试听</title><style>body{margin:0;background:#f4f0e7;color:#263c33;font:17px/1.8 system-ui,sans-serif}main{max-width:740px;margin:auto;padding:26px}section{background:#fffdf7;border:1px solid #d4d8cb;border-radius:12px;padding:20px;margin:20px 0}h1{font-size:27px}h2{font-size:21px}audio{width:100%}a{color:#24644d}</style><main><h1>前十秒 · 去掉叠风，换轻微风</h1><section><h2>▶ 听当前修改：0–10秒</h2><audio controls preload="metadata" src="opening10.wav"></audio><p>删除额外树林风；旧开场风叶、森林环境与公园杂底不再叠加，换一层轻微风实录。风铃保留，相机和脚步维持上一轮 +4 dB。</p></section><section><h2>只听替换后的微风</h2><audio controls preload="none" src="breeze-only.wav"></audio><p>与上面混音同音量，没有单独放大。CC0 夜间轻风拂树叶录音，取前段、滤掉低频轰声；不选末尾风势增强的部分。</p></section><p>微风持续铺到10秒，9.4秒接入索道低鸣，9.75秒接入远处鸟鸣。原风声里夹带的零散鸟声、人声无法独立拆开，随旧环境层一起移除；独立鸟鸣保留。</p><p>这里只做前十秒试音，尚未覆盖整片或处理全片循环。原 V51 成片未改。未做人耳听审。</p><p><a href="mix.json">处理记录</a> · <a href="LICENSES.md">录音来源与许可</a></p></main><script>document.querySelectorAll('audio').forEach(a=>a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(b=>{if(a!==b)b.pause()})));</script></html>
