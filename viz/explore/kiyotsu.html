<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>清津峡 · 光之隧道</title>
<style>
  html,body{margin:0;height:100%;background:#040506}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
// 清津峡 · 光之隧道 —— 风格探索：极简几何 + 强对称 + 大面积黑。
// render(t) 是确定性的：同一个 t 永远是同一帧。?record=1 时不自动播放，由外部调用 render(t)。
const W = 1080, H = 1920, T = 25;
const PLAN = [            // [镜头, 起, 止]（秒）
  ['walk',    0,    7.0],  // 黑暗里往里走，途中洞口漏光
  ['arrive',  7.0,  9.8],  // 尽头的光变成半个圆
  ['half',    9.8, 11.8],  // 半圆里的峡谷
  ['reveal', 11.8, 13.2],  // 水面把圆补全
  ['wade',   13.2, 19.3],  // 人走进水里，涟漪；四季换色
  ['card',   19.3, 23.5],  // 片尾信息
  ['return', 23.5, 25.0],  // 圆缩回一点光，接回开头
];
const TEXT_WINDOWS = [
  [0.8, 4.0, '先往山里走 750 米'],
  [4.6, 8.0, '半路，几个洞口漏进一点峡谷'],
  [9.9, 11.7, '走到头，是半个圆'],
  [12.1, 14.4, '脚下一层水，补上另外半个'],
  [14.9, 17.0, '踩进去，圆会晃'],
  [17.3, 19.2, '同一个圆，一年换三次颜色'],
];
const ARC_WINDOWS = [
  [10.2, 12.9, '柱状节理的岩壁 · 日本三大峡谷之一'],
  [13.5, 14.9, '新绿　5月'],
  [16.0, 17.3, '红叶　10月中旬—11月上旬'],
  [18.6, 23.3, '雪　12月下旬—4月上旬'],
];
const CARD = {
  title: '清津峡 · 光之隧道',
  en: 'TUNNEL OF LIGHT',
  credit: '马岩松 / MAD 建筑事务所　2018 大地艺术祭',
  tips: ['连休、盂兰盆、红叶季的部分日子，只收预约票', '冬天照常开，大雪会临时关'],
};
const HEADER = {zh: '清津峡', en: 'KIYOTSU GORGE · TOKAMACHI, NIIGATA'};
function shotAt(t) { t = ((t % T) + T) % T; for (const [n, a, b] of PLAN) if (t >= a && t < b) return n; return PLAN[0][0]; }

const cv = document.getElementById('c'), g = cv.getContext('2d', {willReadFrequently: true});
const CX = 540, CY = 880, R = 390;           // 最终的圆：水平线穿过圆心
const VPY = 820, ER = 0.4, FOC = 2340;        // 隧道透视：消失点高度、视线高/半径、焦距×半宽
const R0 = 5;                                 // 开头和结尾那一点光
const BW = 2 * R, BH = R;                     // 峡谷画在这块缓冲里（半圆），倒影从它逐像素取样
const buf = document.createElement('canvas'); buf.width = BW; buf.height = BH;
const b = buf.getContext('2d', {willReadFrequently: true});
const rbuf = document.createElement('canvas'); rbuf.width = BW; rbuf.height = BH;
const rb = rbuf.getContext('2d');
const rimg = rb.createImageData(BW, BH);

const CJK = '"Source Han Sans SC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const font = (w, px) => `${w} ${px}px Sora,${CJK}`;

// ---------- 小工具 ----------
const clamp = (x, a = 0, c = 1) => x < a ? a : x > c ? c : x;
const lerp = (a, c, u) => a + (c - a) * u;
const sm = (a, c, x) => { const u = clamp((x - a) / (c - a)); return u * u * (3 - 2 * u); };
const eio = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const win = (t, a, c, fi = .5, fo = .5) => sm(a, a + fi, t) * (1 - sm(c - fo, c, t));
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix3 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u), lerp(p[2], q[2], u)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ---------- 四季配色：只有洞口里的峡谷有颜色 ----------
const PAL = {
  skyTop: ['#9fc8dc', '#c3d3dd', '#b4bec8'], skyBot: ['#eaf4ee', '#f7ebd2', '#eef1f3'],
  far:    ['#8db5a2', '#c39a72', '#c9d1d8'], far2:   ['#a9c9b8', '#d9b98f', '#dde3e8'],
  rock:   ['#86837a', '#8c7c6e', '#7b8188'], rockD:  ['#4c4b47', '#4e423b', '#3c4147'],
  v0:     ['#4c9a4a', '#cf5527', '#6f6359', '#eef1f4'], v1:     ['#8fca62', '#f0ac34', '#8a7b6c', '#ffffff'],
  v2:     ['#2a6f3d', '#8f2a1c', '#4a423c', '#cfd7de'], v3:     ['#5fae52', '#e27a2a', '#7a6d60', '#e9eef2'],
  river:  ['#58b3a4', '#4b9aa2', '#3d6c7e'],
};
for (const k in PAL) PAL[k] = PAL[k].map(hex);
const pal = (k, s) => { const a = PAL[k];
  if (s <= 1) return mix3(a[0], a[1], clamp(s));
  if (a.length === 3) return mix3(a[1], a[2], clamp(s - 1));
  return s <= 1.5 ? mix3(a[1], a[2], clamp((s - 1) * 2)) : mix3(a[2], a[3], clamp((s - 1.5) * 2)); };

// ---------- 峡谷（缓冲坐标：780×390，底边 = 水面线） ----------
const CLIFF_L = [[0, 390], [0, 0], [176, 0], [204, 44], [236, 62], [252, 132], [284, 190], [296, 252], [320, 296], [330, 346], [320, 390]];
const CLIFF_R = [[780, 390], [780, 0], [604, 0], [596, 70], [556, 92], [546, 164], [508, 206], [498, 282], [470, 312], [468, 350], [484, 390]];
const FAR_A = [[236, 390], [286, 214], [326, 150], [352, 128], [380, 156], [404, 226], [420, 390]];
const FAR_B = [[372, 390], [398, 236], [436, 168], [486, 120], [528, 104], [560, 150], [580, 390]];
function poly(c, pts) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); }
// 沿崖顶和崖面预先摆好的树丛（确定性）
const BLOBS = [];
(function () {
  const edge = (pts, u) => { // 崖的内侧轮廓：第 2 点到倒数第 2 点
    const n = pts.length - 3, f = clamp(u, 0, .999) * n, i = 2 + Math.floor(f), k = f - Math.floor(f);
    return [lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)];
  };
  for (let side = 0; side < 2; side++) {
    const pts = side ? CLIFF_R : CLIFF_L, dir = side ? 1 : -1;
    for (let i = 0; i < 96; i++) {
      const u = Math.pow(hash(i * 3.1 + side * 77), 1.1) * .7, e = edge(pts, u);
      const inset = Math.pow(hash(i * 5.7 + side * 31 + 9), 2.6) * 44;
      BLOBS.push({x: e[0] + dir * (inset + 4), y: e[1] + 4 + hash(i * 9.3 + side) * 14 + inset * .5,
        r: 6 + hash(i * 1.7 + side * 3) * 6 - u * 2, k: Math.floor(hash(i * 7.7 + side * 13) * 4), ph: hash(i + side * 50) * 6.28, front: 1});
    }
    for (let i = 0; i < 12; i++) { // 河边的灌木
      const u = .8 + hash(i * 4.4 + side * 19) * .2, e = edge(pts, u);
      BLOBS.push({x: e[0] + dir * hash(i * 2.2 + side) * 26, y: e[1] + hash(i + side * 7) * 14, r: 4 + hash(i * 6.1 + side) * 5,
        k: Math.floor(hash(i * 8.3 + side * 5) * 4), ph: hash(i * 1.3 + side) * 6.28, front: 1});
    }
  }
  BLOBS.sort((p, q) => p.y - q.y);
})();

const CLIFFS = new Path2D();
for (const pts of [CLIFF_L, CLIFF_R]) { pts.forEach((p, i) => i ? CLIFFS.lineTo(p[0], p[1]) : CLIFFS.moveTo(p[0], p[1])); CLIFFS.closePath(); }
function columnField(c, seed, rock, rockD, lean, fan, bend) {
  let x0 = -220, i = 0;
  while (x0 < BW + 220) {
    const w = 9 + hash(seed + i * 1.9) * 12, sh = hash(seed + i * 4.3);
    // 柱子的中线：整体倾斜 + 扇形展开 + 一点弯
    const fx = (xx, y) => { const v = (390 - y) / 390; return xx + (lean + (xx - 390) * fan) * (390 - y) + bend * v * v * 60; };
    const strip = (xa, xb, y0, y1) => { c.beginPath(); for (let k = 0; k <= 8; k++) { const y = lerp(y0, y1, k / 8); c.lineTo(fx(xa, y), y); } for (let k = 8; k >= 0; k--) { const y = lerp(y0, y1, k / 8); c.lineTo(fx(xb, y), y); } c.closePath(); c.fill(); };
    c.fillStyle = rgb(mix3(rockD, rock, .12 + sh * 1.15)); strip(x0, x0 + w + .7, -20, 400);
    c.fillStyle = 'rgba(255,255,255,.17)'; strip(x0 + 1, x0 + 1 + Math.max(1.4, w * .24), -20, 400);   // 受光的棱
    c.fillStyle = 'rgba(8,9,10,.55)'; strip(x0 + w - 1.7, x0 + w + .3, -20, 400);                      // 柱缝
    for (let j = 0; j < 7; j++) {                                                                      // 横向断口
      const y = hash(seed + i * 7.1 + j * 13.7) * 400;
      c.fillStyle = `rgba(8,9,10,${.22 + hash(seed + i + j * 3.3) * .3})`; strip(x0, x0 + w, y, y + 1.6);
      c.fillStyle = 'rgba(255,255,255,.10)'; strip(x0, x0 + w, y + 1.6, y + 3.4);
    }
    x0 += w; i++;
  }
}
function columns(c, pts, lean, seed, rock, rockD) {
  // 柱状节理：成组斜立的棱柱，上下两层朝向不同，中间一道岩棚
  const L = pts === CLIFF_L;
  c.save(); poly(c, pts); c.clip();
  c.fillStyle = rgb(rockD); c.fillRect(0, 0, BW, BH);
  columnField(c, seed, rock, rockD, lean, L ? .00035 : -.0003, L ? .5 : -.4);
  // 上层：岩棚以上换一组朝向
  const ledge = L ? [[0, 250], [90, 232], [170, 196], [236, 150], [262, 120]] : [[780, 214], [700, 196], [630, 150], [575, 118], [548, 96]];
  c.save(); c.beginPath(); c.moveTo(L ? 0 : 780, -10); ledge.forEach(p => c.lineTo(p[0], p[1])); c.lineTo(L ? 300 : 500, -10); c.closePath(); c.clip();
  c.fillStyle = rgb(rockD); c.fillRect(0, 0, BW, BH);
  columnField(c, seed + 300, rock, rockD, -lean * 1.6, L ? -.0005 : .0006, L ? -.8 : .7);
  c.restore();
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = 'rgba(6,7,8,.6)'; c.lineWidth = 5; c.beginPath(); ledge.forEach((p, i) => i ? c.lineTo(p[0], p[1] + 3) : c.moveTo(p[0], p[1] + 3)); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1.6; c.beginPath(); ledge.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
  let gr = c.createLinearGradient(L ? 60 : 720, 0, L ? 340 : 440, 0);   // 谷里的天光：靠中间亮、靠外暗
  gr.addColorStop(0, 'rgba(0,0,0,.30)'); gr.addColorStop(.6, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(255,255,255,.14)');
  c.fillStyle = gr; c.fillRect(0, 0, BW, BH);
  gr = c.createLinearGradient(0, 250, 0, 390); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.30)');
  c.fillStyle = gr; c.fillRect(0, 0, BW, BH);
  c.restore();
}
// 不动的部分（远山、岩壁、石头）按三个季节各烘一张，播放时只做交叉淡化
const BAKED = [0, 1, 2].map(s => {
  const mk = () => { const cv = document.createElement('canvas'); cv.width = BW; cv.height = BH; return cv; };
  const back = mk(), front = mk(); let c = back.getContext('2d');
  poly(c, FAR_B); c.fillStyle = rgb(pal('far2', s)); c.fill();
  c.save(); poly(c, FAR_B); c.clip();
  for (let i = 0; i < 90; i++) { const x = 380 + hash(i * 2.9) * 200, y = 100 + hash(i * 6.1) * 270; c.fillStyle = rgb(pal(i % 2 ? 'v1' : 'v3', s), .34); c.beginPath(); c.arc(x, y, 4 + hash(i) * 6, 0, 7); c.fill(); }
  c.restore();
  poly(c, FAR_A); c.fillStyle = rgb(pal('far', s)); c.fill();
  c.save(); poly(c, FAR_A); c.clip();
  for (let i = 0; i < 110; i++) { const x = 240 + hash(i * 3.7 + 5) * 180, y = 124 + hash(i * 4.9 + 2) * 256; c.fillStyle = rgb(pal('v' + (i % 4), s), .5); c.beginPath(); c.arc(x, y, 4 + hash(i + 40) * 7, 0, 7); c.fill(); }
  let gr = c.createLinearGradient(0, 200, 0, 390); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,.22)');
  c.fillStyle = gr; c.fillRect(0, 0, BW, BH);
  c.restore();
  c = front.getContext('2d');
  columns(c, CLIFF_L, .13, 11, pal('rock', s), pal('rockD', s));
  columns(c, CLIFF_R, -.10, 57, pal('rock', s), pal('rockD', s));
  for (let i = 0; i < 9; i++) {   // 崖脚的石头
    const L = i % 2, y = 318 + hash(i * 2.7) * 70, x = (L ? 328 - (y - 300) * .1 : 474 + (y - 300) * .1) + (hash(i * 5.1) - .5) * 16;
    c.fillStyle = rgb(mix3(pal('rockD', s), pal('rock', s), hash(i) * .6)); c.beginPath(); c.ellipse(x, y, 9 + hash(i * 9) * 9, 5 + hash(i * 4) * 4, 0, 0, 7); c.fill();
    if (s === 2) { c.fillStyle = 'rgba(245,247,250,1)'; c.beginPath(); c.ellipse(x, y - 3, 8 + hash(i * 9) * 8, 3, 0, 0, 7); c.fill(); }
  }
  return {back, front};
});
function baked(c, key, s) {
  const i = s >= 1 ? 1 : 0, u = clamp(s - i);
  c.drawImage(BAKED[i][key], 0, 0);
  if (u > .002) { c.globalAlpha = u; c.drawImage(BAKED[i + 1][key], 0, 0); c.globalAlpha = 1; }
}

function drawGorge(t, s) {
  const c = b, wA = clamp(1 - Math.abs(s - 1)), wS = clamp(s - 1);
  // 天
  let gr = c.createLinearGradient(0, 0, 0, 300);
  gr.addColorStop(0, rgb(pal('skyTop', s))); gr.addColorStop(1, rgb(pal('skyBot', s)));
  c.fillStyle = gr; c.fillRect(0, 0, BW, BH);
  // 云：慢慢横移
  for (let i = 0; i < 5; i++) {
    const x = ((hash(i * 9.1) * 620 + t * (5 + i * 1.6)) % 620) + 80, y = 26 + hash(i * 3.3) * 120, rx = 60 + hash(i * 5.5) * 70;
    const cg = c.createRadialGradient(x, y, 0, x, y, rx);
    cg.addColorStop(0, 'rgba(255,255,255,.75)'); cg.addColorStop(1, 'rgba(255,255,255,0)');
    c.save(); c.translate(x, y); c.scale(1, .34); c.translate(-x, -y); c.fillStyle = cg; c.fillRect(x - rx, y - rx, 2 * rx, 2 * rx); c.restore();
  }
  baked(c, 'back', s);   // 远处交错的山嘴
  // 谷底的雾
  for (let i = 0; i < 3; i++) {
    const x = 400 + Math.sin(t * .23 + i * 2.1) * 70, y = 232 + i * 26, rx = 150 + i * 30;
    const mg = c.createRadialGradient(x, y, 0, x, y, rx);
    mg.addColorStop(0, `rgba(255,255,255,${.30 + wS * .12})`); mg.addColorStop(1, 'rgba(255,255,255,0)');
    c.save(); c.translate(x, y); c.scale(1, .22); c.translate(-x, -y); c.fillStyle = mg; c.fillRect(x - rx, y - rx, 2 * rx, 2 * rx); c.restore();
  }
  // 河：朝观众流过来
  c.beginPath(); c.moveTo(398, 258); c.lineTo(312, 390); c.lineTo(492, 390); c.closePath();
  gr = c.createLinearGradient(0, 258, 0, 390);
  gr.addColorStop(0, rgb(mix3(pal('river', s), [255, 255, 255], .45))); gr.addColorStop(1, rgb(pal('river', s)));
  c.fillStyle = gr; c.fill();
  for (let i = 0; i < 34; i++) {
    const p = (hash(i * 3.9) + t * (.22 + hash(i * 1.1) * .16)) % 1, y = 262 + p * p * 126, hw = (y - 258) / 132 * 84;
    const x = 398 + (hash(i * 7.3) * 2 - 1) * hw * .82 + Math.sin(t * 1.4 + i) * 1.5;
    c.fillStyle = `rgba(255,255,255,${.75 * Math.sin(Math.PI * p)})`;
    c.fillRect(x - (2 + p * 9), y, 4 + p * 18, 1 + p * 1.8);
  }
  baked(c, 'front', s);  // 两侧岩壁
  // 一道慢慢扫过岩壁的日光
  const sunX = 390 + Math.sin(t * .26 + .6) * 250;
  c.save(); c.clip(CLIFFS);
  gr = c.createLinearGradient(sunX - 150, 0, sunX + 150, 90);
  gr.addColorStop(0, 'rgba(255,248,225,0)'); gr.addColorStop(.5, 'rgba(255,248,225,.24)'); gr.addColorStop(1, 'rgba(255,248,225,0)');
  c.fillStyle = gr; c.fillRect(0, 0, BW, BH); c.restore();
  // 树丛：随季节换色，轻轻摇
  const sx = o => o.x + Math.sin(t * 1.1 + o.ph) * 1.2;
  c.fillStyle = rgb(pal('rockD', s), .45); for (const o of BLOBS) { c.beginPath(); c.arc(sx(o) + 1, o.y + o.r * .45, o.r + 1, 0, 7); c.fill(); }
  c.fillStyle = rgb(pal('v2', s)); for (const o of BLOBS) { c.beginPath(); c.arc(sx(o), o.y, o.r + 1, 0, 7); c.fill(); }
  c.fillStyle = rgb(pal('v0', s)); for (const o of BLOBS) if (o.k !== 3) { c.beginPath(); c.arc(sx(o) - o.r * .12, o.y - o.r * .22, o.r * .72, 0, 7); c.fill(); }
  c.fillStyle = rgb(pal('v1', s)); for (const o of BLOBS) if (o.k === 0) { c.beginPath(); c.arc(sx(o) - o.r * .3, o.y - o.r * .45, o.r * .3, 0, 7); c.fill(); }
  // 秋天几片落叶，冬天下雪
  if (wA > .01) for (let i = 0; i < 18; i++) {
    const p = (hash(i * 6.7) + t * (.07 + hash(i * 2.3) * .05)) % 1, x = 120 + hash(i * 3.1) * 540 + Math.sin(t * 1.3 + i * 2) * 18, y = p * 390;
    c.save(); c.translate(x, y); c.rotate(t * 2 + i); c.fillStyle = rgb(PAL[i % 2 ? 'v0' : 'v1'][1], wA * .9); c.fillRect(-3, -1.5, 6, 3); c.restore();
  }
  if (wS > .01) for (let i = 0; i < 130; i++) {
    const p = (hash(i * 4.1) + t * (.09 + hash(i * 2.9) * .07)) % 1, x = hash(i * 8.7) * 780 + Math.sin(t * .9 + i) * 12, y = p * 400 - 5;
    c.fillStyle = `rgba(255,255,255,${wS * (.55 + hash(i) * .4)})`; c.beginPath(); c.arc(x, y, 1 + hash(i * 1.9) * 1.7, 0, 7); c.fill();
  }
}

// ---------- 人：站在水里的剪影 ----------
const WALK0 = 13.4, WALK1 = 17.6, STEP = 0.5;
const PX0 = CX - R - 30, PX1 = CX - 34;
const personX = t => lerp(PX0, PX1, clamp((t - WALK0) / (WALK1 - WALK0)));
function drawPerson(c, x, t) {
  if (t < WALK0 - .2) return;
  const wa = 1 - sm(WALK1 - .35, WALK1 + .1, t), ph = (t - WALK0) / STEP * Math.PI;
  const sw = Math.sin(ph) * .42 * wa, bob = Math.abs(Math.cos(ph)) * 2.2 * wa, idle = Math.sin(t * 1.3) * .6 * (1 - wa);
  c.save(); c.translate(x + idle, BH - 1 + bob * .3); c.scale(1.22, 1.22);
  c.strokeStyle = c.fillStyle = '#07080a'; c.lineCap = 'round'; c.lineJoin = 'round';
  const hipY = -50 - bob, shY = -90 - bob;
  c.lineWidth = 8.5;                                        // 腿
  for (const d of [1, -1]) { c.beginPath(); c.moveTo(d * 2.5, hipY); c.lineTo(d * 3 + Math.sin(sw * d) * 46, hipY + Math.cos(sw * d) * 50 + 2); c.stroke(); }
  c.beginPath(); c.moveTo(-10.5, shY + 3); c.quadraticCurveTo(0, shY - 5, 10.5, shY + 3); c.lineTo(11.5, hipY + 4); c.lineTo(-11.5, hipY + 4); c.closePath(); c.fill();   // 外套
  c.lineWidth = 5.5;                                        // 手臂
  const lift = sm(18.1, 18.9, t);
  for (const d of [1, -1]) { const u = d === 1 ? lift : 0; c.beginPath(); c.moveTo(d * 10, shY + 6);
    if (u > 0) c.lineTo(lerp(d * 13, 17, u), lerp(shY + 24, shY + 12, u));
    c.lineTo(lerp(d * 12 - Math.sin(sw * d) * 20, 12, u), lerp(shY + 42 - Math.abs(sw) * 4, shY - 12, u)); c.stroke(); }
  c.beginPath(); c.arc(0, shY - 13, 8.6, 0, 7); c.fill();   // 头
  c.restore();
}
// 每一步在水面留下一圈涟漪；站定后偶尔再晃一下
function ripplesAt(t) {
  const out = [];
  for (let k = 0; WALK0 + k * STEP < WALK1 + .01; k++) {
    const ts = WALK0 + k * STEP + STEP * .5, age = t - ts, x = personX(ts) - (CX - R);
    if (age > 0 && age < 3.6 && x > -30) out.push({x, age, amp: 1});
  }
  for (let k = 0; k < 4; k++) { const age = t - (18.5 + k * 1.5); if (age > 0 && age < 3.6) out.push({x: PX1 - (CX - R), age, amp: .6}); }
  return out;
}

// ---------- 真实的镜面倒影：从峡谷缓冲逐像素取样，涟漪改变取样位置 ----------
function reflect(t, rip) {
  const src = b.getImageData(0, 0, BW, BH).data, out = rimg.data;
  const rowA = new Float32Array(BH), rowB = new Float32Array(BH), colA = new Float32Array(BW);
  for (let y = 0; y < BH; y++) { rowA[y] = Math.sin(y * .31 - t * 2.3); rowB[y] = Math.sin(y * .083 + t * 1.1); }
  for (let x = 0; x < BW; x++) colA[x] = Math.sin(x * .019 + t * .8);
  const n = rip.length, rx = new Float32Array(n), rr = new Float32Array(n), ra = new Float32Array(n);
  for (let i = 0; i < n; i++) { rx[i] = rip[i].x; rr[i] = 10 + rip[i].age * 78; ra[i] = rip[i].amp * 17 * Math.exp(-rip[i].age * .75) * Math.min(1, rip[i].age * 5); }
  const BAND = 44, R2 = R * R;
  for (let y = 0; y < BH; y++) {
    const depth = y / BH, amb = .5 + depth * 2.6, ey = (y + 3) / .34, ey2 = ey * ey;
    const half = Math.sqrt(Math.max(0, R2 - y * y)), x0 = Math.max(0, Math.floor(R - half) - 1), x1 = Math.min(BW, Math.ceil(R + half) + 1);
    for (let x = x0; x < x1; x++) {
      let dx = amb * (rowA[y] + .6 * colA[x] * rowB[y]), dy = amb * .5 * rowB[y] * colA[x], lum = 0;
      for (let i = 0; i < n; i++) {
        const ex = x - rx[i], d = Math.sqrt(ex * ex + ey2), ph = d - rr[i];
        if (ph > -BAND && ph < BAND) {
          const e = 1 - Math.abs(ph) / BAND, w = Math.sin(ph * .2) * e * e * ra[i];
          dx += w * ex / (d + 1); dy += w * 1.25; lum += w;
        }
      }
      let fx = x + dx, fy = BH - 1 - y - dy;
      fx = fx < 0 ? 0 : fx > BW - 1.001 ? BW - 1.001 : fx; fy = fy < 0 ? 0 : fy > BH - 1.001 ? BH - 1.001 : fy;
      const ix = fx | 0, iy = fy | 0, ux = fx - ix, uy = fy - iy, si = (iy * BW + ix) * 4, sj = si + BW * 4, oi = (y * BW + x) * 4;
      const w00 = (1 - ux) * (1 - uy), w10 = ux * (1 - uy), w01 = (1 - ux) * uy, w11 = ux * uy, m = .9 - depth * .16 + lum * .028;
      out[oi] = (src[si] * w00 + src[si + 4] * w10 + src[sj] * w01 + src[sj + 4] * w11) * m;
      out[oi + 1] = (src[si + 1] * w00 + src[si + 5] * w10 + src[sj + 1] * w01 + src[sj + 5] * w11) * m;
      out[oi + 2] = (src[si + 2] * w00 + src[si + 6] * w10 + src[sj + 2] * w01 + src[sj + 6] * w11) * m;
      out[oi + 3] = 255;
    }
  }
  rb.putImageData(rimg, 0, 0);
}

// ---------- 文字：细、小、留白；可沿圆弧排 ----------
function spaced(str, x, y, f, sp, color, a) {
  if (a <= .003) return;
  g.save(); g.font = f; g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillStyle = color; g.globalAlpha = a;
  const ch = [...str], ws = ch.map(c => g.measureText(c).width), total = ws.reduce((p, q) => p + q, 0) + sp * (ch.length - 1);
  let cx = x - total / 2;
  ch.forEach((c, i) => { g.fillText(c, cx, y); cx += ws[i] + sp; });
  g.restore();
}
function arcText(str, cx, cy, r, f, sp, color, a) {   // 沿圆的上缘，从左读到右
  if (a <= .003) return;
  g.save(); g.font = f; g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillStyle = color; g.globalAlpha = a;
  const ch = [...str], ws = ch.map(c => g.measureText(c).width), total = ws.reduce((p, q) => p + q, 0) + sp * (ch.length - 1);
  let s = -total / 2;
  ch.forEach((c, i) => {
    const ang = (s + ws[i] / 2) / r;
    g.save(); g.translate(cx + Math.sin(ang) * r, cy - Math.cos(ang) * r); g.rotate(ang); g.fillText(c, 0, 0); g.restore();
    s += ws[i] + sp;
  });
  g.restore();
}

// ---------- 隧道：一圈圈半圆，匀速迎面而来 ----------
function tunnel(t, alpha, camT) {
  if (alpha <= .003) return;
  const cam = 4.5 * camT;
  g.save(); g.lineCap = 'round';
  // 途中的洞口：左壁开口，漏进峡谷的颜色
  for (const X of [27, 36, 45]) {
    const zn = Math.max(.95, X - cam), zf = X + 2.6 - cam;
    if (zf <= 1.05 || zn > 17) continue;
    const a = alpha * (1 - sm(11, 17, zn)) * sm(2.4, 7, X - cam) * alpha;
    if (a <= .003) continue;
    const rn = FOC / zn, rf = FOC / zf, yn = VPY + ER * rn, yf = VPY + ER * rf;
    const A0 = 171 * Math.PI / 180, A1 = 139 * Math.PI / 180;
    g.beginPath();
    for (let i = 0; i <= 12; i++) { const th = lerp(A0, A1, i / 12); g.lineTo(CX + rn * Math.cos(th), yn - rn * Math.sin(th)); }
    for (let i = 12; i >= 0; i--) { const th = lerp(A0, A1, i / 12); g.lineTo(CX + rf * Math.cos(th), yf - rf * Math.sin(th)); }
    g.closePath();
    const top = yn - rn * Math.sin(A1), bot = yn - rn * Math.sin(A0);
    const gr = g.createLinearGradient(0, top, 0, bot);
    gr.addColorStop(0, `rgba(226,240,236,${a})`); gr.addColorStop(.45, `rgba(150,200,150,${a})`); gr.addColorStop(1, `rgba(70,140,90,${a})`);
    g.fillStyle = gr; g.fill();
    g.strokeStyle = `rgba(30,48,40,${a * .4})`; g.lineWidth = Math.max(1, rn / 160);
    for (let j = 1; j < 6; j++) { const rj = FOC / lerp(zn, zf, j / 6), yj = VPY + ER * rj, tj = lerp(A0, A1, .25 + .5 * hash(X + j)); g.beginPath(); g.moveTo(CX + rj * Math.cos(A0), yj - rj * Math.sin(A0)); g.lineTo(CX + rj * Math.cos(tj), yj - rj * Math.sin(tj)); g.stroke(); }
  }
  for (let m = Math.ceil((cam + .7) / 4.5); m * 4.5 - cam < 60; m++) {
    const z = m * 4.5 - cam, rad = FOC / z, y = VPY + ER * rad;
    const a = alpha * .34 * sm(.7, 2.4, z) * (1 - sm(20, 60, z));
    if (a <= .003) continue;
    g.strokeStyle = `rgba(196,206,214,${a})`; g.lineWidth = clamp(rad / 260, .8, 2.6);
    g.beginPath(); g.arc(CX, y, rad, Math.PI, 2 * Math.PI); g.stroke();
    g.beginPath(); g.moveTo(CX - rad, y); g.lineTo(CX + rad, y); g.strokeStyle = `rgba(196,206,214,${a * .55})`; g.stroke();
    g.strokeStyle = `rgba(255,250,235,${Math.min(1, a * 2.6)})`; g.lineWidth = clamp(rad / 90, 1, 5);   // 顶上的灯
    g.beginPath(); g.arc(CX, y, rad, -Math.PI / 2 - .05, -Math.PI / 2 + .05); g.stroke();
  }
  g.restore();
}

// ---------- 一帧 ----------
function render(time) {
  const t = ((time % T) + T) % T;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#040506'; g.fillRect(0, 0, W, H);

  // 圆的半径与水面线位置：开头是一点光，走到头长成半圆，结尾缩回去
  const arrive = eio((t - 7.0) / 2.8), back = eio((t - 23.5) / 1.5);
  let r = R0 + 44 * Math.pow(clamp(t / 7.2), 1.5); r = lerp(r, R, arrive); r = lerp(r, R0, back);
  const grow = clamp((r - R0) / (R - R0));
  const er = lerp(ER, (CY - VPY) / R, Math.pow(grow, .6));
  const baseY = VPY + er * r;
  const tun = t < 12 ? 1 - sm(7.6, 9.6, t) : sm(23.6, 24.9, t);          // 隧道感：走的时候有，到了就退场
  const reveal = t < 11.8 ? 0 : eio((t - 11.8) / 1.4);
  const water = reveal * (1 - sm(23.5, 24.5, t));                       // 结尾倒影淡出，不再擦除
  const settled = sm(9.2, 10.2, t) * (1 - sm(23.5, 24.3, t));
  const season = t < 12 ? 0 : sm(14.9, 16.1, t) + sm(17.2, 18.7, t);
  const white = 1 - sm(30, 250, r);

  // 隧道
  tunnel(t, tun, t < 12 ? t : t - T);
  // 湿地面上那道反光：倒影的预告
  if (tun > .003) for (const [hw, len, al] of [[r * .7 + 3, 640, .42], [r * 2.6 + 10, 300, .12]]) {
    g.save(); g.beginPath(); g.rect(0, baseY + 1.5, W, H); g.clip();
    g.translate(CX, baseY); g.scale(hw / 100, len / 100);
    const fg = g.createRadialGradient(0, 0, 0, 0, 0, 100);
    fg.addColorStop(0, `rgba(235,242,246,${al * tun})`); fg.addColorStop(1, 'rgba(235,242,246,0)');
    g.fillStyle = fg; g.fillRect(-100, 0, 200, 100); g.restore();
  }

  // 光晕：只在水面线以上
  g.save(); g.beginPath(); g.rect(0, 0, W, baseY); g.clip();
  const halo = g.createRadialGradient(CX, baseY, r * .9, CX, baseY, r * 1.9 + 30);
  halo.addColorStop(0, `rgba(210,225,232,${.20 - .12 * settled})`); halo.addColorStop(1, 'rgba(210,225,232,0)');
  g.fillStyle = halo; g.fillRect(0, 0, W, baseY); g.restore();

  // 水面延伸到脚下：细碎的反光和水平线
  if (water > .003) {
    g.save();
    for (let i = 0; i < 64; i++) {
      const d = Math.pow(hash(i * 2.3), 1.4), y = baseY + 14 + d * 640, len = 16 + d * 90 + hash(i * 5.9) * 40;
      const x = hash(i * 9.7) * W + Math.sin(t * .5 + i) * 10, a = (.04 + .10 * Math.pow(Math.sin(t * (.7 + hash(i) * .9) + i * 1.7) * .5 + .5, 2)) * water;
      g.fillStyle = `rgba(214,226,232,${a})`; g.fillRect(x - len / 2, y, len, 1.3);
    }
    // 圆外也看得见的涟漪
    g.lineWidth = 1.2;
    for (const p of ripplesAt(t)) {
      const rad = 10 + p.age * 78, a = .26 * water * p.amp * Math.exp(-p.age * .8) * Math.min(1, p.age * 4);
      for (let k = 0; k < 2; k++) { g.strokeStyle = `rgba(214,226,232,${a * (k ? .5 : 1)})`; g.beginPath(); g.ellipse(CX - R + p.x, baseY + 2, rad + k * 16, (rad + k * 16) * .34, 0, 0, Math.PI); g.stroke(); }
    }
    g.restore();
  }

  // 洞口里的峡谷
  if (white < .999) { drawGorge(t, season); drawPerson(b, personX(t) - (CX - R), t); }
  g.save(); g.beginPath(); g.arc(CX, baseY, r, Math.PI, 2 * Math.PI); g.closePath(); g.clip();
  if (white < .999) g.drawImage(buf, CX - r, baseY - r, 2 * r, r);
  if (white > .001) { g.fillStyle = `rgba(244,248,250,${white})`; g.fillRect(CX - r, baseY - r, 2 * r, r); }
  g.restore();

  // 倒影：从水面线往下铺开，合成一个圆
  if (water > .003 && white < .999) {
    reflect(t, ripplesAt(t));
    g.save(); g.beginPath(); g.rect(0, baseY, W, r * reveal + 1); g.clip();
    g.beginPath(); g.arc(CX, baseY, r, 0, Math.PI); g.closePath(); g.clip();
    g.globalAlpha = sm(0, .25, reveal) * water / Math.max(reveal, .001);
    g.drawImage(rbuf, CX - r, baseY, 2 * r, r);
    g.restore();
  }
  // 圆的轮廓：从两端沿下半圆描下去，在最低点合上
  if (settled > 0) {
    g.save(); g.lineWidth = 1.4; g.strokeStyle = `rgba(232,238,242,${.5 * Math.max(settled, 0)})`;
    g.beginPath(); g.arc(CX, baseY, r + 1, Math.PI, 2 * Math.PI); g.stroke();
    const sweep = eio((t - 11.6) / 1.3) * (t >= 11.6 ? 1 : 0) * Math.PI / 2;
    if (sweep > 0) { g.beginPath(); g.arc(CX, baseY, r + 1, 0, sweep); g.stroke(); g.beginPath(); g.arc(CX, baseY, r + 1, Math.PI - sweep, Math.PI); g.stroke(); }
    // 水平线
    const ext = lerp(60, 540, eio((t - 10.0) / 2.4));
    const lg = g.createLinearGradient(CX - r - ext, 0, CX + r + ext, 0);
    lg.addColorStop(0, 'rgba(232,238,242,0)'); lg.addColorStop(.25, `rgba(232,238,242,${.34 * settled})`); lg.addColorStop(.75, `rgba(232,238,242,${.34 * settled})`); lg.addColorStop(1, 'rgba(232,238,242,0)');
    g.fillStyle = lg; g.fillRect(CX - r - ext, baseY - .6, 2 * (r + ext), 1.2);
    g.restore();
  }

  // ---------- 文字 ----------
  const ink = '#e9edf0';
  spaced(HEADER.zh, CX + 14, 176, font(300, 34), 28, ink, .9);
  spaced(HEADER.en, CX + 4, 230, font(300, 18), 7, ink, .55);
  for (const [a, c, s] of TEXT_WINDOWS) spaced(s, CX + 5, 1470, font(300, 40), 10, ink, win(t, a, c) * .95);
  for (const [a, c, s] of ARC_WINDOWS) arcText(s, CX, CY, R + 46, font(300, 25), 9, ink, win(t, a, c, .6, .6) * .82);
  // 里程：一条细线，一个往前走的点
  const ca = win(t, .5, 9.4, .7, .6);
  if (ca > .003) {
    const p = sm(0, 9.0, t), x0 = CX - 150, x1 = CX + 150;
    g.fillStyle = `rgba(233,237,240,${.28 * ca})`; g.fillRect(x0, 1589.4, 300, 1.2);
    g.fillStyle = `rgba(233,237,240,${.9 * ca})`; g.fillRect(x0, 1589.4, 300 * p, 1.2);
    g.beginPath(); g.arc(x0 + 300 * p, 1590, 4.2, 0, 7); g.fill();
    spaced(String(Math.round(750 * p)).padStart(3, '0') + ' m', CX + 3, 1640, font(200, 26), 6, ink, ca * .8);
  }
  // 片尾
  const ka = win(t, 19.5, 23.7, .7, .6);
  if (ka > .003) {
    spaced(CARD.title, CX + 7, 1440, font(200, 60), 14, ink, ka);
    spaced(CARD.en, CX + 7, 1516, font(300, 21), 14, ink, ka * .6);
    g.fillStyle = `rgba(233,237,240,${.3 * ka})`; g.fillRect(CX - 24, 1565, 48, 1.2);
    spaced(CARD.credit, CX + 2, 1622, font(300, 30), 4, ink, ka * .88);
    spaced(CARD.tips[0], CX + 2, 1716, font(300, 32), 4, ink, win(t, 19.9, 23.7, .7, .6) * .82);
    spaced(CARD.tips[1], CX + 2, 1774, font(300, 32), 4, ink, win(t, 20.2, 23.7, .7, .6) * .82);
  }
}

// ---------- 播放 ----------
(function boot() {
  const params = new URLSearchParams(location.search);
  window.render = render; window.LOOP_SECONDS = T; window.START_SECONDS = 0; window.PLAN = PLAN;
  // 在线时用网络字体；断网时直接用系统里的黑体，画面照常
  if (navigator.onLine !== false && !params.has('nofont')) {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300&family=Sora:wght@200;300&display=swap';
    document.head.appendChild(l);
  }
  const all = [HEADER.zh, HEADER.en, CARD.title, CARD.en, CARD.credit, ...CARD.tips, ...TEXT_WINDOWS.map(x => x[2]), ...ARC_WINDOWS.map(x => x[2]), '0123456789 m'].join('');
  const fonts = new Promise(res => {
    const done = () => res(); setTimeout(done, 3500);
    const go = () => Promise.all([200, 300].flatMap(w => [document.fonts.load(`${w} 30px "Noto Sans SC"`, all), document.fonts.load(`${w} 30px Sora`, all)])).then(done, done);
    const l = document.querySelector('link[rel=stylesheet]');
    if (!l) return done();
    if (l.sheet) go(); else { l.addEventListener('load', go); l.addEventListener('error', done); }
  });
  fonts.then(() => {
    if (params.has('record')) { render(0); window.READY = true; return; }
    const start = performance.now();
    const tick = () => { render((performance.now() - start) / 1000); requestAnimationFrame(tick); };
    window.READY = true; tick();
  });
})();
</script>
</body>
