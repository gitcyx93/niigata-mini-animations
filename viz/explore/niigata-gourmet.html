<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新潟美食 · 一粒米，变出一桌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Sora:wght@600;800&display=swap">
<style>
  html,body{margin:0;height:100%;background:#141b33}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:min(100vw,56.25vh);aspect-ratio:9/16;display:block;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// 新潟美食（风格探索）——「一粒米，变出一桌」。俯拍餐桌 + 海报式动态排版。
// 约定：render(t) 是确定性的（同一 t 同一帧，随机用种子哈希）；?record=1 时不自动播放，由外部调用 render(t)。
'use strict';
const SRC = document.currentScript.textContent;
const W = 1080, H = 1920, T = 22.6, TAU = Math.PI * 2;
const canvas = document.getElementById('c');
let g = canvas.getContext('2d');
const C = {cream: '#F4EAD3', red: '#E1452B', navy: '#1C2B57', must: '#EDB73C', pine: '#1E5B4B', white: '#FFFDF7'};
const FF = '"Sora","Source Han Sans SC","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const font = (w, s) => `${w} ${s}px ${FF}`;

// ======== 小工具 ========
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (a, s, d) => clamp((a - s) / d);
const frac = x => x - Math.floor(x);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rnd(i, s = 0) { const x = Math.sin(i * 127.1 + s * 311.7 + 17.3) * 43758.5453; return x - Math.floor(x); }
const SPR = {};
function sprite(key, w, h, draw) {
  if (!SPR[key]) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const keep = g; g = c.getContext('2d'); g.translate(w / 2, h / 2); draw(); g = keep; SPR[key] = c;
  }
  return SPR[key];
}
function stamp(s, x = 0, y = 0) { g.drawImage(s, x - s.width / 2, y - s.height / 2); }
function circ(x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = fill; g.fill(); }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

// ======== 文字 ========
function txt(s, x, y, size, color, o = {}) {
  g.save(); g.font = font(o.w || 900, size); g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic';
  if (o.ls != null && 'letterSpacing' in g) g.letterSpacing = o.ls + 'px';
  let sc = o.scale || 1;
  if (o.max) { const m = g.measureText(s).width; if (m > o.max) sc *= o.max / m; }
  g.translate(x, y); if (o.rot) g.rotate(o.rot); g.scale(sc, sc);
  if (o.alpha != null) g.globalAlpha *= o.alpha;
  if (o.stroke) { g.lineWidth = o.lw || 6; g.strokeStyle = o.stroke; g.lineJoin = 'round'; g.strokeText(s, 0, 0); }
  if (color) { g.fillStyle = color; g.fillText(s, 0, 0); }
  g.restore();
}
// 砸进来：放大→原大
function slam(s, x, y, size, color, a, o = {}) {
  if (a <= 0) return; const p = prog(a, 0, o.dur || .3);
  txt(s, x, y, size, color, {...o, scale: lerp(o.from || 1.6, 1, eExpo(p)), alpha: clamp(p * 5)});
}
// 逐字从遮罩下方顶上来
function rise(s, x, y, size, color, a, o = {}) {
  if (a <= 0) return;
  g.save(); g.font = font(o.w || 900, size); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  const total = g.measureText(s).width; let sc = 1; if (o.max && total > o.max) sc = o.max / total;
  const x0 = o.align === 'center' ? x - total * sc / 2 : o.align === 'right' ? x - total * sc : x;
  g.translate(x0, y); g.scale(sc, sc);
  g.beginPath(); g.rect(-30, -size * 1.1, total + 60, size * 1.4); g.clip();
  g.fillStyle = color; let cx = 0, i = 0; const st = o.stagger ?? .045, d = o.dur ?? .36;
  for (const ch of s) {
    const p = eExpo(prog(a, i * st, d)), wch = g.measureText(ch).width;
    if (p > 0) g.fillText(ch, cx, (1 - p) * size * 1.3); cx += wch; i++;
  }
  g.restore();
}
// 竖排，逐字弹出
function vtxt(s, x, y, size, color, a, o = {}) {
  let i = 0;
  for (const ch of s) {
    const p = prog(a, i * .07, .22);
    if (p > 0) txt(ch, x, y + i * size * 1.12, size, color, {w: o.w || 900, align: 'center', scale: lerp(1.7, 1, eExpo(p)), alpha: clamp(p * 4)});
    i++;
  }
}
// 贴纸：锯齿圆 + 两行字，带一点晃
function sticker(x, y, r, bg, fg, lines, a, o = {}) {
  if (a <= 0) return; const sc = eBack(prog(a, 0, .34));
  g.save(); g.translate(x, y); g.rotate((o.rot ?? -.2) + Math.sin(a * 2.4) * .045); g.scale(sc, sc);
  g.beginPath(); const n = 18;
  for (let i = 0; i < n * 2; i++) { const rr = i % 2 ? r : r * .9, an = i * Math.PI / n; g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  g.closePath(); g.fillStyle = 'rgba(0,0,0,.2)'; g.save(); g.translate(8, 11); g.fill(); g.restore();
  g.fillStyle = bg; g.fill();
  g.beginPath(); g.arc(0, 0, r * .78, 0, TAU); g.setLineDash([7, 9]); g.lineWidth = 3; g.strokeStyle = fg; g.globalAlpha = .55; g.stroke(); g.globalAlpha = 1; g.setLineDash([]);
  const hTot = lines.reduce((s, l) => s + l[1] * 1.12, 0); let yy = -hTot / 2;
  for (const [s, size] of lines) { yy += size * 1.12; txt(s, 0, yy - size * .22, size, fg, {align: 'center', max: r * 1.4}); }
  g.restore();
}
// 胶囊标签
function pill(s, x, y, size, bg, fg, a) {
  if (a <= 0) return; const p = eExpo(prog(a, 0, .35));
  g.save(); g.font = font(800, size); const w = g.measureText(s).width + size * 1.1, h = size * 1.7;
  g.beginPath(); g.rect(x - 4, y - 4, (w + 8) * p, h + 8); g.clip();
  rrect(x, y, w, h, h / 2); g.fillStyle = bg; g.fill();
  g.restore(); g.save(); g.beginPath(); g.rect(x - 4, y - 4, (w + 8) * p, h + 8); g.clip();
  txt(s, x + size * .55, y + h / 2 + size * .04, size, fg, {w: 800, base: 'middle'}); g.restore();
}
// 跑马灯色带
function band(yc, h, rot, bg, fg, s, a, speed = 170) {
  g.save(); g.translate(W / 2, yc); g.rotate(rot); g.fillStyle = bg; g.fillRect(-W, -h / 2, 2 * W, h);
  g.font = font(800, h * .5); g.fillStyle = fg; g.textBaseline = 'middle'; g.textAlign = 'left';
  const w = g.measureText(s).width;
  for (let x = -((a * speed) % w) - W; x < W; x += w) g.fillText(s, x, h * .04);
  g.restore();
}
// 漫画式冲击线
function burst(x, y, r0, r1, n, color, p, lw = 8, rot = 0) {
  if (p <= 0 || p >= 1) return;
  g.save(); g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.globalAlpha *= 1 - p * p;
  const a0 = lerp(r0, r1, eOut(p)), a1 = lerp(r0, r1, eOut(clamp(p + .3)));
  for (let i = 0; i < n; i++) { const an = rot + i * TAU / n; g.beginPath(); g.moveTo(x + Math.cos(an) * a0, y + Math.sin(an) * a0); g.lineTo(x + Math.cos(an) * a1, y + Math.sin(an) * a1); g.stroke(); }
  g.restore();
}

// ======== 食物的零件 ========
function steam(cx, cy, a, n, spread, alpha = .5, h = 300) {
  g.save(); g.lineCap = 'round'; g.strokeStyle = '#fff'; const base = g.globalAlpha;
  for (let i = 0; i < n; i++) {
    const ph = frac(a * .34 + i / n + rnd(i, 7) * .3), al = Math.sin(Math.PI * ph) * alpha; if (al <= .01) continue;
    const x = cx + (i - (n - 1) / 2) * spread + Math.sin(a * 1.1 + i * 2) * 10, y = cy - ph * h, sw = 24 * (i % 2 ? 1 : -1);
    g.globalAlpha = base * al; g.lineWidth = 13 + ph * 11; g.beginPath();
    g.moveTo(x, y); g.bezierCurveTo(x + sw, y - 38, x - sw, y - 80, x + sw * .4, y - 122); g.stroke();
  }
  g.restore();
}
function grainAt(x, y, l, rot, shade) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.beginPath(); g.ellipse(0, 0, l / 2, l * .25, 0, 0, TAU); g.fillStyle = shade; g.fill();
  g.lineWidth = Math.max(1.2, l * .07); g.strokeStyle = 'rgba(126,108,72,.46)'; g.stroke();
  g.beginPath(); g.ellipse(-l * .08, -l * .075, l * .22, l * .05, 0, 0, TAU); g.fillStyle = 'rgba(255,255,255,.95)'; g.fill();
  g.restore();
}
const RICE_TONES = ['#FFFFFF', '#FCFAF3', '#F5F0E3', '#FFFFFF'];
function riceSprite(R) {
  return sprite('rice' + R, 2 * R + 60, 2 * R + 60, () => {
    const gr = g.createRadialGradient(-R * .25, -R * .3, R * .1, 0, 0, R);
    gr.addColorStop(0, '#FDFAF1'); gr.addColorStop(.65, '#F1EAD7'); gr.addColorStop(1, '#D8CEB2');
    circ(0, 0, R * .96, gr);
    const n = Math.round(R * R / 70), l = R * .105;
    for (let i = 0; i < n; i++) {
      const rad = R * Math.sqrt(rnd(i, 1)), an = rnd(i, 2) * TAU;
      grainAt(Math.cos(an) * rad, Math.sin(an) * rad, l * (.85 + rnd(i, 3) * .3), rnd(i, 4) * TAU, RICE_TONES[i % 4]);
    }
    for (let i = 0; i < 40; i++) { const rad = R * .8 * Math.sqrt(rnd(i, 5)), an = rnd(i, 6) * TAU; circ(Math.cos(an) * rad - R * .1, Math.sin(an) * rad - R * .1, 2.2, 'rgba(255,255,255,.9)'); }
  });
}
function sticks(tx, ty, ang, gap, col, tip, len = 1000) {
  for (const pass of [0, 1]) for (const s of [-1, 1]) {
    g.save(); g.translate(tx + (pass ? 0 : 16), ty + (pass ? 0 : 26)); g.rotate(ang + s * gap); g.translate(0, s * 5);
    g.beginPath(); g.moveTo(0, -4.5); g.lineTo(len, -12); g.lineTo(len, 12); g.lineTo(0, 4.5); g.closePath();
    g.fillStyle = pass ? col : 'rgba(0,0,0,.2)'; g.fill();
    if (pass) { g.beginPath(); g.moveTo(0, -4.5); g.lineTo(150, -5.6); g.lineTo(150, 5.6); g.lineTo(0, 4.5); g.closePath(); g.fillStyle = tip; g.fill();
      g.beginPath(); g.moveTo(8, -1.5); g.lineTo(len, -6); g.lineWidth = 2.5; g.strokeStyle = 'rgba(255,255,255,.35)'; g.stroke(); }
    g.restore();
  }
}

// ---- 01 白饭 ----
function dishRice(a, still) {
  const R = 370;
  circ(22, 32, R, 'rgba(0,0,0,.24)');
  circ(0, 0, R, '#FBF8F0'); circ(0, 0, R * .955, '#2A4596'); circ(0, 0, R * .865, '#FBF8F0');
  g.save(); g.strokeStyle = '#FBF8F0'; g.lineWidth = 7; g.lineCap = 'round';
  for (let i = 0; i < 40; i++) { const an = i * TAU / 40; g.beginPath(); g.arc(Math.cos(an) * R * .91, Math.sin(an) * R * .91, 11, an + .4, an + 2.7); g.stroke(); }
  g.restore();
  circ(0, 0, R * .82, '#CFC8B4'); circ(6, 10, R * .8, '#E6E0CF');
  const lift = still ? 0 : eIO(prog(a, 1.5, .7)), px = lerp(70, 170, lift), py = lerp(30, -110, lift) + (still ? 0 : Math.sin(a * 2.2) * 8 * lift);
  stamp(riceSprite(280));
  if (!still && a > 1.45) { g.save(); g.globalAlpha = .13 * clamp((a - 1.45) * 4); g.beginPath(); g.ellipse(72, 36, 62, 46, .3, 0, TAU); g.fillStyle = '#5A4A22'; g.fill(); g.restore(); }
  steam(-20, -40, a + 3, 4, 110, .5, 330);
  if (still) return;
  const inn = eExpo(prog(a, 1.0, .45)); if (inn <= 0) return;
  const tx = lerp(700, px, inn), ty = lerp(620, py, inn);
  if (lift > 0) {
    g.save(); g.globalAlpha = .26 * lift; g.beginPath(); g.ellipse(px + 34 * lift, py + 84 * lift, 96, 68, .3, 0, TAU); g.fillStyle = '#000'; g.fill(); g.restore();
    g.save(); g.translate(px, py); g.scale(1 + lift * .75, 1 + lift * .75);
    g.beginPath(); g.ellipse(0, 6, 58, 42, .3, 0, TAU); g.fillStyle = '#EFE8D4'; g.fill(); g.lineWidth = 3; g.strokeStyle = 'rgba(120,102,66,.7)'; g.stroke();
    for (let i = 0; i < 44; i++) { const rad = 56 * Math.sqrt(rnd(i, 21)), an = rnd(i, 22) * TAU; grainAt(Math.cos(an) * rad * 1.1, 6 + Math.sin(an) * rad * .8, 29, rnd(i, 23) * TAU, RICE_TONES[i % 4]); }
    g.restore();
  }
  sticks(tx - 30, ty - 6, .78, .034 - .012 * lift, '#C8352A', '#3A1410');
}

// ---- 02 酱汁炸猪排饭 ----
function katsuSprite(seed, rw, rh) {
  return sprite('katsu' + seed, 2 * rw + 60, 2 * rh + 60, () => {
    const path = k => { g.beginPath(); for (let i = 0; i <= 60; i++) { const th = i / 60 * TAU, r = k * (1 + .07 * Math.sin(3 * th + seed * 1.7) + .045 * Math.sin(5 * th + seed * 2.9) + .02 * Math.sin(17 * th + seed)); g.lineTo(rw * r * Math.cos(th), rh * r * Math.sin(th)); } g.closePath(); };
    path(1.04); g.fillStyle = '#6A2E0C'; g.fill();
    path(1); const gr = g.createRadialGradient(-rw * .2, -rh * .3, 5, 0, 0, rw); gr.addColorStop(0, '#CE7B2B'); gr.addColorStop(1, '#8C4514'); g.fillStyle = gr; g.fill();
    g.save(); path(1); g.clip();
    const tones = ['#E6A654', '#D88E3A', '#F2C27A', '#9B5318', '#B9691F'];
    for (let i = 0; i < 260; i++) { const x = (rnd(i, seed) * 2 - 1) * rw, y = (rnd(i, seed + 9) * 2 - 1) * rh; g.beginPath(); g.ellipse(x, y, 2 + rnd(i, seed + 3) * 4.5, 1.6 + rnd(i, seed + 4) * 3, rnd(i, 5) * 3, 0, TAU); g.fillStyle = tones[i % 5]; g.fill(); }
    // 甜咸酱汁的釉色：一侧更深
    g.fillStyle = 'rgba(74,22,3,.22)'; g.fillRect(-rw * 2, -rh * 2, rw * 4, rh * 4);
    for (let i = 0; i < 4; i++) { g.beginPath(); g.ellipse((rnd(i, seed + 30) - .3) * rw, (rnd(i, seed + 31) - .2) * rh, rw * (.3 + rnd(i, seed + 32) * .3), rh * (.22 + rnd(i, seed + 33) * .25), rnd(i, seed + 34) * 3, 0, TAU); g.fillStyle = 'rgba(66,18,2,.3)'; g.fill(); }
    g.restore();
    g.lineCap = 'round'; g.strokeStyle = 'rgba(255,244,220,.62)';
    g.lineWidth = 9; g.beginPath(); g.ellipse(0, 0, rw * .68, rh * .62, 0, Math.PI * 1.08, Math.PI * 1.42); g.stroke();
    g.lineWidth = 6; g.beginPath(); g.ellipse(0, 0, rw * .5, rh * .42, 0, Math.PI * 1.15, Math.PI * 1.36); g.stroke();
    circ(-rw * .02, -rh * .6, 5, 'rgba(255,244,220,.7)');
  });
}
const KATSU = [{x: -128, y: -98, r: -.5}, {x: 128, y: -112, r: .45}, {x: 150, y: 100, r: 1.9}, {x: -112, y: 124, r: 2.7}, {x: 8, y: 2, r: .12}];
function dishKatsu(a, still) {
  const R = 390;
  circ(24, 34, R, 'rgba(0,0,0,.26)');
  circ(0, 0, R, '#C9302A'); circ(0, 0, R * .955, '#141C3A');
  g.save(); g.rotate(still ? .3 : a * .1);
  g.strokeStyle = '#E8B23A'; g.lineWidth = 5;
  for (let i = 0; i < 12; i++) { const an = i * TAU / 12; g.beginPath(); g.arc(0, 0, R * .9, an, an + .3); g.stroke(); }
  circ(0, 0, R * .84, '#0C1228');
  stamp(riceSprite(300));
  // 酱汁渗进饭里
  for (let i = 0; i < 9; i++) { const k = KATSU[i % 5]; g.beginPath(); g.ellipse(k.x * 1.25 + (rnd(i, 41) - .5) * 120, k.y * 1.25 + (rnd(i, 42) - .5) * 120, 34 + rnd(i, 43) * 30, 22 + rnd(i, 44) * 20, rnd(i, 45) * 3, 0, TAU); g.fillStyle = 'rgba(120,58,14,' + (.28 * (still ? 1 : prog(a, .5 + (i % 5) * .2, .3))) + ')'; g.fill(); }
  KATSU.forEach((k, i) => {
    const ai = still ? 9 : a - (.38 + .2 * i); if (ai <= 0) return;
    const p = prog(ai, 0, .26), fall = p * p, land = Math.max(0, ai - .26);
    const sc = lerp(2.1, 1, fall) * (1 - .07 * Math.exp(-land * 12) * Math.cos(land * 34));
    g.save(); g.globalAlpha = clamp(ai * 9);
    g.translate(k.x, k.y);
    g.save(); g.translate(lerp(60, 9, fall), lerp(90, 13, fall)); g.rotate(k.r); g.scale(sc, sc); g.beginPath(); g.ellipse(0, 0, 128, 100, 0, 0, TAU); g.fillStyle = 'rgba(40,14,0,.3)'; g.fill(); g.restore();
    g.rotate(k.r + (1 - fall) * .5); g.scale(sc, sc); stamp(katsuSprite(i + 1, 125, 98));
    // 釉面的反光来回扫
    g.rotate(-k.r); g.globalAlpha *= .25 + .25 * Math.sin(a * 3.2 + i * 1.7);
    g.lineCap = 'round'; g.strokeStyle = '#FFF6E0'; g.lineWidth = 8; g.beginPath(); g.arc(8, 10, 70, Math.PI * 1.1, Math.PI * 1.45); g.stroke();
    g.restore();
    if (!still) burst(k.x, k.y, 120, 190, 10, '#FFF6E0', prog(ai, .26, .3), 7, i);
  });
  g.restore();
  steam(0, -60, a + 1, 4, 120, still ? .4 : .5 * prog(a, 1.5, .6), 340);
}

// ---- 03 片木荞麦 ----
function sobaBundle(x, y, seed, sc = 1) {
  g.save(); g.translate(x, y); g.rotate((rnd(seed, 1) - .5) * .5 + (seed % 2 ? .25 : -.2)); g.scale(sc, sc); g.lineCap = 'round'; g.lineJoin = 'round';
  // 一束面对折成圈：几根并排的面条沿同一条"α"形走线
  const A = 46 + rnd(seed, 2) * 6, B = 64, TH = 2.45, N = 40, K = 8;
  const pt = (f, k) => {
    const th = lerp(-TH, TH, f), x0 = A * (Math.sin(th) - .47 * th), y0 = -B * Math.cos(th) - 8;
    const dx = A * (Math.cos(th) - .47), dy = B * Math.sin(th), n = Math.hypot(dx, dy) || 1, d = (k - (K - 1) / 2) * 5.6 + Math.sin(f * 9 + k + seed) * 1.2;
    return [x0 - dy / n * d, y0 + dx / n * d];
  };
  for (const [f0, f1] of [[0, .56], [.5, 1]]) for (const pass of [0, 1]) for (let k = 0; k < K; k++) {
    g.beginPath(); for (let i = 0; i <= N; i++) { const [px, py] = pt(lerp(f0, f1, i / N), k); g.lineTo(px, py); }
    g.lineWidth = pass ? 4.6 : 8; g.strokeStyle = pass ? (k % 2 ? '#B9B08A' : '#9C946C') : '#57513A'; g.stroke();
  }
  g.restore();
}
function sobaHang(x, y, len, a) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  for (const pass of [0, 1]) for (let k = 0; k < 11; k++) {
    const ox = (k - 5) * 7, L = len * (.82 + rnd(k, 51) * .18);
    g.beginPath(); g.moveTo(x + ox * .35, y);
    for (let j = 1; j <= 7; j++) { const f = j / 7; g.lineTo(x + ox * (.35 + f * .75) + Math.sin(a * 5.5 + k * .9 + j * .8) * 7 * f, y + L * f); }
    g.lineWidth = pass ? 6 : 10; g.strokeStyle = pass ? (k % 2 ? '#B4AC84' : '#9A936B') : '#55503A'; g.stroke();
  }
  g.restore();
}
function sobaTray() {
  return sprite('tray', 860, 680, () => {
    const w = 780, h = 600;
    rrect(-w / 2, -h / 2, w, h, 14); g.fillStyle = '#A87A45'; g.fill();

  const cupX = 905, cupY = 1378;
  g.save(); g.translate(cupX, cupY); const cs = eBack(prog(a, .45, .35)); g.scale(cs, cs); if (cs > 0) sobaCup(a); g.restore();

    }

const RING = [[dishRice, .38], [dishKatsu, .37], [dishSoba, .38], [dishDango, .37], [dishSake, .42]];

    const p = eBack(prog(a, .1 + i * .09, .4)); if (p <= 0) return;
    const an = -Math.PI / 2 + i * TAU / 5 + a * .22 + (1 - p) * .8;
    g.save(); g.translate(cx + Math.cos(an) * 345, cy + Math.sin(an) * 345); g.scale(s * p, s * p); if (f === dishSake || f === dishSoba) g.rotate(.1 - i * .06); f(a + 4, true); g.restore();
  });

  slam('去新潟，', 70, 1520, 176, C.navy, a - .7, {from: 1.3});

  // 收尾：红色从正中铺满，接回片头

  if (out > 0) circ(cx, cy, 1300 * out * out, C.red);
}

// 分镜表（检查器会读 PLAN）：[名字, 开始, 结束]
const PLAN = [['title', 0, 2.6], ['rice', 2.6, 6.1], ['katsu', 6.1, 9.6], ['soba', 9.6, 13.2], ['dango', 13.2, 16.5], ['sake', 16.5, 19.75], ['final', 19.75, T]];
const SCENES = [sTitle, sRice, sKatsu, sSoba, sDango, sSake, sFinal];
const ENTER = [null, 'circle', 'pushL', 'pushU', 'diag', 'circle', 'pushL'];
const TR = .32;
function shotAt(t) { t = ((t % T) + T) % T; for (let i = PLAN.length - 1; i >= 0; i--) if (t >= PLAN[i][1]) return i; return 0; }
function drawScene(i, a) { g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip(); SCENES[i](a); g.restore(); }
function render(t) {
  t = ((t % T) + T) % T;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.clearRect(0, 0, W, H);
  const i = shotAt(t), a = t - PLAN[i][1];
  if (!ENTER[i] || a >= TR) { drawScene(i, a); return; }
  const p = eIO(a / TR), prevA = t - PLAN[i - 1][1];
  g.save();
  if (ENTER[i] === 'pushL') { g.translate(-W * p, 0); drawScene(i - 1, prevA); g.translate(W, 0); drawScene(i, a); }
  else if (ENTER[i] === 'pushU') { g.translate(0, -H * p); drawScene(i - 1, prevA); g.translate(0, H); drawScene(i, a); }
  else {
    drawScene(i - 1, prevA);
    g.beginPath();
    if (ENTER[i] === 'circle') g.arc(540, 1010, 1320 * p, 0, TAU);
    else { const x = (W + 700) * p; g.moveTo(0, 0); g.lineTo(x, 0); g.lineTo(x - 700, H); g.lineTo(0, H); g.closePath(); }
    g.save(); g.lineWidth = 44; g.strokeStyle = C.must; g.stroke(); g.restore();
    g.clip(); drawScene(i, a);
  }
  g.restore();
}

// ======== 播放和导出 ========
const params = new URLSearchParams(location.search), REC = params.has('record');
async function loadFonts() {
  if (!document.fonts || !document.fonts.load) return;
  const cjk = [...new Set(SRC.replace(/[\x00-\x7f]/g, ''))].join('');
  const jobs = [];
  for (const w of [500, 700, 900]) jobs.push(document.fonts.load(`${w} 64px "Noto Sans SC"`, cjk));
  for (const w of [600, 800]) jobs.push(document.fonts.load(`${w} 64px "Sora"`, 'NIIGATA 0123456789'));
  const wait = new Promise(r => setTimeout(r, REC ? 20000 : 3000));   // 断网时不等：直接用系统字体
  await Promise.race([Promise.allSettled(jobs), wait]);
}
window.render = render; window.LOOP_SECONDS = T; window.START_SECONDS = 0;
window.duration = () => T;
const ready = loadFonts().catch(() => {});
if (REC) ready.then(() => { render(0); window.READY = true; });
else ready.then(() => {
  let base = performance.now(), paused = false, held = 0;
  canvas.addEventListener('click', () => { paused = !paused; if (paused) held = (performance.now() - base) / 1000; else base = performance.now() - held * 1000; });
  const tick = () => { if (!paused) render((performance.now() - base) / 1000); requestAnimationFrame(tick); };
  window.READY = true; tick();
});
</script>
