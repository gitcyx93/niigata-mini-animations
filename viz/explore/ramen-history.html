<script id="print-kit">
/* ===== 版画印刷工具（从 viz/explore/sado.html 提取）=====
   用法：const k = makeKit(ctx, STYLES.shinhanga 或 STYLES.meisho);
   k.blk 色版平涂（带套色错位） k.key 墨线 k.shape 色+线 k.bokashi 拓印渐变
   k.waveRow 浪排 k.humpRow 圆弧排 k.band 霞 k.vtext 竖排字 k.texture 纸纹/木纹/颗粒 */
const STYLES = {
  shinhanga: {
    id: 'shinhanga', name: '新版画',
    C: {paper: '#f1e8d4', white: '#f6efdf', sumi: '#211e23', c1: '#1f3d63', c2: '#7fb0a8', c3: '#d4502c', c4: '#dba646', c5: '#eeb0a0'},
    names: {paper: '纸', sumi: '墨', c1: '藏青', c2: '青瓷', c3: '朱', c4: '赭金', c5: '朱鹮粉'},
    reg: [4, 3], line: 1, lineFar: false, speckle: 1, woodgrain: .35, grainDark: 30,
    titleFont: '"Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC","Songti SC",SimSun,serif', titleWeight: 900
  },
  meisho: {
    id: 'meisho', name: '江户名所绘',
    C: {paper: '#ecdcb6', white: '#f3e8cc', sumi: '#1a1718', c1: '#1c4f8f', c2: '#5d8f5a', c3: '#c8372d', c4: '#e2b33c', c5: '#9a958c'},
    names: {paper: '黄纸', sumi: '墨', c1: '普鲁士蓝', c2: '草绿', c3: '红', c4: '藤黄', c5: '薄墨'},
    reg: [2, 2], line: 1.8, lineFar: true, speckle: 0, woodgrain: 1, grainDark: 22,
    titleFont: '"Ma Shan Zheng","Kaiti SC",STKaiti,KaiTi,"Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC","Songti SC",SimSun,serif', titleWeight: 400
  }
};
function makeKit(g, S) {
  const C = S.C, TAU = Math.PI * 2;
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  function blk(color, path, alpha = 1) { g.save(); g.translate(S.reg[0], S.reg[1]); g.globalAlpha *= alpha; g.beginPath(); path(); g.fillStyle = color; g.fill(); g.restore(); }
  function key(path, lw = 3, color = C.sumi) { g.beginPath(); path(); g.lineWidth = lw * (color === C.sumi ? S.line : 1); g.strokeStyle = color; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }
  function shape(color, path, lw = 3, alpha = 1) { blk(color, path, alpha); if (lw) key(path, lw); }
  function far(color, path, alpha = 1) { blk(color, path, alpha); if (S.lineFar) key(path, 2); }      // 远景：名所绘也勾线
  function bokashi(x, y, w, h, color, a0, a1) { const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, rgba(color, a0)); gr.addColorStop(1, rgba(color, a1)); g.fillStyle = gr; g.fillRect(x, y, w, h); }
  function poly(pts) { g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
  function waveRow(y, w, h, off, W) { let x = -w * 2 + (((off % w) + w) % w); g.moveTo(x, y);
    for (; x < W + w; x += w) { g.bezierCurveTo(x + w * .35, y + h * .15, x + w * .55, y - h * 1.15, x + w * .78, y - h); g.quadraticCurveTo(x + w * .88, y - h * .25, x + w, y); } }
  function humpRow(y, w, h, off, W) { let x = -w * 2 + (((off % w) + w) % w); g.moveTo(x, y); for (; x < W + w; x += w) g.quadraticCurveTo(x + w / 2, y - h * 2, x + w, y); }
  function band(x, y, w, h, color, alpha) { const p = () => { g.moveTo(x + h / 2, y); g.arc(x + w - h / 2, y + h / 2, h / 2, -Math.PI / 2, Math.PI / 2); g.arc(x + h / 2, y + h / 2, h / 2, Math.PI / 2, Math.PI * 1.5); g.closePath(); };
    blk(color, p, alpha); if (S.lineFar) key(p, 1.6); }
  function vtext(str, x, y, size, color, font, weight, step = 1.1) { g.font = weight + ' ' + size + 'px ' + font; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle'; for (let i = 0; i < str.length; i++) g.fillText(str[i], x, y + i * size * step); }
  function texture(W, H) {                                  // 一次生成，之后每帧 drawImage：grain 用 multiply，wear 用普通叠加
    let s = 20240727; const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    const grain = document.createElement('canvas'); grain.width = W >> 1; grain.height = H >> 1;
    const gg = grain.getContext('2d'), im = gg.createImageData(W >> 1, H >> 1), d = im.data;
    for (let y = 0, p = 0; y < H >> 1; y++) { const row = rnd() * 10; for (let x = 0; x < W >> 1; x++, p += 4) { const v = 255 - rnd() * S.grainDark - row; d[p] = v; d[p + 1] = v - 2; d[p + 2] = v - 7; d[p + 3] = 255; } }
    gg.putImageData(im, 0, 0);
    const wear = document.createElement('canvas'); wear.width = W; wear.height = H; const wg = wear.getContext('2d');
    wg.fillStyle = C.paper; for (let i = 0; i < W * H / 53 * S.speckle; i++) { wg.globalAlpha = .25 + rnd() * .5; const r = rnd() < .92 ? 1.6 : 3.4; wg.fillRect(rnd() * W, rnd() * H, r, r); }
    wg.strokeStyle = C.paper; wg.lineCap = 'round';
    for (let i = 0; i < W * H / 9000 * (.5 + S.woodgrain * 1.5); i++) { const y = rnd() * H, x = rnd() * W - 200, len = 200 + rnd() * 700;
      wg.globalAlpha = (.05 + rnd() * .09) * (.6 + S.woodgrain * 1.2); wg.lineWidth = 1 + rnd() * 3; wg.beginPath(); wg.moveTo(x, y);
      wg.bezierCurveTo(x + len * .3, y + rnd() * 16 - 8, x + len * .7, y + rnd() * 16 - 8, x + len, y + rnd() * 10 - 5); wg.stroke(); }
    return {grain, wear};
  }
  return {C, TAU, rgba, hash, blk, key, shape, far, bokashi, poly, waveRow, humpRow, band, vtext, texture};
}
</script>
<script>
'use strict';
/* 拉面小史：江户名所绘风格（docs/STYLES.md 的 B）。render(t) 确定性；动作量化到每秒 8 格。 */
const W = 1080, H = 1920, SCENE = 5, TURN = 0.7, N = 5, T = SCENE * N;
const PLAN = [['port', 0, 5], ['asakusa', 5, 10], ['yatai', 10, 15], ['instant', 15, 20], ['bowl', 20, 25]];
const PX = 60, PY = 350, PW = 960, PH = 1440;
const S = STYLES.meisho, cv = document.getElementById('c'), g = cv.getContext('2d'), k = makeKit(g, S);
const C = k.C, TAU = k.TAU, PI = Math.PI, BR = S.titleFont;
const SERIF = '"Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif';
const LATIN = 'Sora,"Helvetica Neue",Arial,sans-serif';
const NUM = ['一', '二', '三', '四', '五'];
const COPY = [
  {name: '开港', year: '1859', l1: '拉面的故事，从港口开始。', l2: '1859 年横滨开港，华人带来汤面，人称“南京荞麦”。', note: '南京そば · 日本早年对中国汤面的叫法'},
  {name: '浅草', year: '1910', l1: '1910 年，东京浅草开了家来来轩。', l2: '汤里加了酱油，配叉烧、笋干、葱花，一下子火了。', note: '来々軒 · 常被称作日本第一家拉面店'},
  {name: '夜摊', year: '战后', l1: '战后的夜里，面摊推着车来了。', l2: '一声唢呐响，街坊就知道：卖面的到了。', note: 'チャルメラ · 面摊招呼客人的小唢呐'},
  {name: '泡面', year: '1958', l1: '1958 年，大阪的一间后院小屋。', l2: '安藤百福把面油炸、晾干：开水一冲就能吃。', note: 'チキンラーメン（鸡汤拉面）· 1958 年 8 月上市'},
  {name: '一碗', year: '如今', l1: '中国来的一碗汤面，长成了拉面。', l2: '札幌味噌、博多豚骨、东京酱油——各地各有一碗。', note: 'ラーメン · 从横滨开港算起，一百六十多年'}
];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ss = (v, a, b) => { const x = clamp((v - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const fr = x => x - Math.floor(x), pm = (x, m) => x - Math.floor(x / m) * m;
const step = u => Math.floor(u * 8) / 8;
const {blk, key, shape, far, bokashi, poly, band, hash} = k;
const waveRow = (y, w, h, off) => k.waveRow(y, w, h, off, PW), humpRow = (y, w, h, off) => k.humpRow(y, w, h, off, PW);
function open(pts) { g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
function tube(path, w, color) { key(path, (w + 5) / S.line); key(path, w, color); }
function vtext(str, x, y, size, color, font = BR, weight = 400, st = 1.1) { k.vtext(str, x, y, size, color, font, weight, st); }
function htext(str, x, y, size, color, weight, family, align = 'left', maxW = 0, spacing = 0) {
  g.font = weight + ' ' + size + 'px ' + family; g.textAlign = align; g.textBaseline = 'alphabetic';
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
  if (maxW) { const m = g.measureText(str).width; if (m > maxW) g.font = weight + ' ' + Math.floor(size * maxW / m) + 'px ' + family; }
  g.fillStyle = color; g.fillText(str, x, y);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}
/* ---------- 通用零件 ---------- */
function sky(hz, night) {
  g.fillStyle = night ? C.c1 : C.paper; g.fillRect(0, 0, PW, PH);
  if (night) { bokashi(0, 0, PW, 380, C.sumi, .9, 0); return; }
  bokashi(0, 0, PW, 170, C.c1, 1, 0);                       // 天顶一文字
  bokashi(0, hz - 130, PW, 130, C.c3, 0, .9);               // 地平线一抹红
}
function clouds(q, y0, n, seed, col = C.white) {
  for (let i = 0; i < n; i++) { const x = pm(hash(i + seed) * 1300 + q * (10 + i * 6), 1500) - 380; band(x, y0 + i * 74, 300 + hash(i + seed + 5) * 260, 30 + (i % 2) * 12, col, 1); }
}
function waves(q, y0, y1, rows, insert) {
  for (let i = 0; i < rows; i++) {
    const p = i / (rows - 1), y = lerp(y0, y1, Math.pow(p, 1.4)) + Math.sin(q * 1.5 + i * 1.3) * (3 + 6 * p), w = lerp(70, 250, p), h = lerp(8, 44, p), off = q * lerp(12, 60, p) * (i % 2 ? 1 : -.7) + hash(i) * w;
    if (insert) insert(i, y);
    blk(i % 2 ? C.c1 : '#2f67a8', () => { waveRow(y, w, h, off); g.lineTo(PW + w * 2, PH + 80); g.lineTo(-w * 2, PH + 80); });
    key(() => waveRow(y, w, h, off), lerp(3, 6, p), C.white); key(() => waveRow(y + lerp(4, 8, p), w, h, off), 1.2);
  }
}
function steam(x, y, q, h = 240, n = 3, sc = 1) {
  for (let i = 0; i < n; i++) {
    const ph = q * 1.6 + i * 1.7, xx = x + (i - (n - 1) / 2) * 50 * sc, hh = h * (.75 + .25 * hash(i + 7));
    tube(() => { g.moveTo(xx, y); for (let j = 1; j <= 4; j++) { const yy = y - j * hh / 4; g.quadraticCurveTo(xx + (j % 2 ? 1 : -1) * 30 * sc + Math.sin(ph + j) * 8, yy + hh / 8, xx + Math.sin(ph + j * .9) * 12, yy); } }, 11 * sc, C.white);
  }
}
function person(x, y, s, col, o = {}) {                     // 脚在原点，高约 100
  g.save(); g.translate(x, y); g.scale(s * (o.flip ? -1 : 1), s);
  shape(col, () => poly([[-17, 0], [-13, -60], [-9, -70], [9, -70], [13, -60], [17, 0]]), 1.6);
  blk(o.obi || C.sumi, () => g.rect(-14, -46, 28, 8));
  if (o.arm) tube(() => { g.moveTo(8, -62); g.quadraticCurveTo(o.arm[0] * .5 + 6, o.arm[1] * .5 - 26, o.arm[0], o.arm[1]); }, 7, col);
  if (o.arm2) tube(() => { g.moveTo(-8, -62); g.quadraticCurveTo(o.arm2[0] * .5 - 6, o.arm2[1] * .5 - 26, o.arm2[0], o.arm2[1]); }, 7, col);
  shape(C.white, () => g.arc(0, -82, 11, 0, TAU), 1.4);
  if (o.hat === 'bowler') { blk(C.sumi, () => { g.arc(0, -88, 11, PI, TAU); g.rect(-16, -89, 32, 4); }); }
  else if (o.hat === 'band') { blk(C.sumi, () => g.arc(0, -84, 11.5, PI * 1.05, PI * 1.95)); key(() => { g.moveTo(-11, -86); g.lineTo(11, -86); }, 2.4, C.white); }
  else if (o.hat === 'cap') { blk(C.white, () => { g.arc(0, -90, 10, PI, TAU); g.rect(-10, -91, 20, 5); }); key(() => { g.arc(0, -90, 10, PI, TAU); }, 1.2); }
  else if (o.hat === 'queue') { blk(C.sumi, () => g.arc(0, -86, 11.5, PI, TAU)); key(() => { g.moveTo(-8, -84); g.quadraticCurveTo(-18, -60, -12, -34); }, 2.2); }
  else blk(C.sumi, () => { g.arc(0, -85, 11.5, PI, TAU); g.arc(0, -96, 5, 0, TAU); });
  g.restore();
}
function bowlSmall(x, y, s) { shape(C.white, () => { g.moveTo(x - 16 * s, y); g.quadraticCurveTo(x, y + 22 * s, x + 16 * s, y); g.closePath(); }, 1.4); key(() => { g.moveTo(x - 12 * s, y + 6 * s); g.lineTo(x + 12 * s, y + 6 * s); }, 1.4, C.c1); }
function fuji(x, hz, s) {
  far(C.c5, () => poly([[x - 250 * s, hz], [x - 90 * s, hz - 150 * s], [x - 34 * s, hz - 214 * s], [x - 12 * s, hz - 222 * s], [x + 14 * s, hz - 222 * s], [x + 36 * s, hz - 212 * s], [x + 100 * s, hz - 146 * s], [x + 270 * s, hz]]));
  shape(C.white, () => poly([[x - 60 * s, hz - 184 * s], [x - 34 * s, hz - 214 * s], [x - 12 * s, hz - 222 * s], [x + 14 * s, hz - 222 * s], [x + 36 * s, hz - 212 * s], [x + 66 * s, hz - 180 * s], [x + 40 * s, hz - 164 * s], [x + 18 * s, hz - 182 * s], [x - 4 * s, hz - 160 * s], [x - 28 * s, hz - 180 * s], [x - 44 * s, hz - 166 * s]]), 1.4);
}
/* ---------- 一 开港：横滨 1859 ---------- */
function scenePort(u) {
  const q = step(u), hz = 500;
  sky(hz); fuji(300, hz, 1.1);
  far(C.c2, () => { humpRow(hz + 4, 300, 46, 60); g.lineTo(PW + 400, hz + 40); g.lineTo(-400, hz + 40); });
  clouds(q, 210, 2, 3);
  g.fillStyle = C.c1; g.fillRect(0, hz, PW, 560); bokashi(0, hz, PW, 150, C.white, .8, 0);
  waves(q, hz + 30, 1010, 7, (i, y) => {
    if (i === 2) {                                           // 远处的帆船
      g.save(); g.translate(190 + q * 8, y - 4);
      key(() => { g.moveTo(0, 0); g.lineTo(0, -110); }, 2.4); shape(C.white, () => poly([[5, -106], [52, -88], [56, -30], [5, -18]]), 1.6);
      shape(C.c4, () => poly([[-50, -10], [-36, 10], [52, 10], [68, -14], [30, -6], [-20, -6]]), 1.6); g.restore();
    }
    if (i === 4) {                                           // 蒸汽船
      g.save(); g.translate(640 - q * 10, y - 6 + Math.sin(q * 1.7) * 5); g.rotate(Math.sin(q * 1.7 + .8) * .015);
      for (let j = 0; j < 5; j++) { const a = fr(q * .4 + j / 5); shape(C.white, () => g.arc(20 + a * 240, -210 - a * 90, 16 + a * 34, 0, TAU), 1.2); }
      key(() => { g.moveTo(-120, -20); g.lineTo(-120, -230); g.moveTo(130, -20); g.lineTo(130, -210); g.moveTo(-170, -160); g.lineTo(-70, -160); g.moveTo(90, -150); g.lineTo(170, -150); }, 3);
      key(() => { g.moveTo(-120, -230); g.lineTo(-230, -40); g.moveTo(-120, -230); g.lineTo(-10, -60); g.moveTo(130, -210); g.lineTo(214, -40); }, 1);
      shape(C.c3, () => poly([[-120, -230], [-70, -218], [-120, -206]]), 1.2);
      shape(C.sumi, () => poly([[-8, -60], [-2, -190], [38, -190], [44, -60]]), 1.6); blk(C.c3, () => g.rect(-4, -170, 44, 16));
      shape(C.sumi, () => poly([[-250, -52], [-196, 14], [196, 14], [232, -46], [150, -38], [-150, -38]]), 2);
      key(() => { g.moveTo(-236, -30); g.lineTo(220, -24); }, 3, C.white);
      shape(C.c4, () => { g.arc(10, 0, 62, PI, TAU); g.closePath(); }, 2);
      key(() => { for (let j = 1; j < 6; j++) { const a = PI + j * PI / 6 + q * .6 % (PI / 6); g.moveTo(10, 0); g.lineTo(10 + Math.cos(a) * 58, Math.sin(a) * 58); } }, 1.2);
      g.restore();

  shape(C.c5, () => poly([[-20, 1010], [980, 980], [980, 1070], [-20, 1100]]), 2.4);          // 石码头
  key(() => { for (let j = 0; j < 14; j++) { const x = j * 74 + (j % 2) * 20; g.moveTo(x, 1008 - x * .03); g.lineTo(x - 6, 1098 - x * .03); } open([[-20, 1056], [980, 1026]]); }, 1.2);
  blk(C.white, () => poly([[-20, 1100], [980, 1070], [980, 1500], [-20, 1500]])); bokashi(0, 1260, PW, 180, C.c4, 0, .7);
  key(() => open([[-20, 1100], [980, 1070]]), 2);
  // 面摊：锅、师傅抻面、等面的人
  shape(C.c4, () => poly([[600, 1250], [900, 1236], [900, 1300], [600, 1316]]), 2); shape(C.c4, () => g.rect(620, 1312, 22, 110), 1.6); shape(C.c4, () => g.rect(866, 1298, 22, 110), 1.6);
  steam(820, 1200, q, 250, 3, 1);
  shape(C.sumi, () => { g.moveTo(770, 1206); g.quadraticCurveTo(820, 1290, 870, 1206); g.closePath(); }, 1.6); key(() => { g.moveTo(764, 1206); g.lineTo(876, 1206); }, 3);
  const sp = 80 + 56 * (.5 + .5 * Math.sin(q * 2.6));        // 抻面
  person(560, 1400, 2.5, C.c1, {hat: 'queue', obi: C.c3, arm: [sp * .4 + 6, -122], arm2: [-sp * .4 - 6, -122]});
  for (let j = 0; j < 6; j++) key(() => { g.moveTo(560 - sp - 14, 1096); g.quadraticCurveTo(560, 1096 + 22 + j * 9 + Math.sin(q * 2.6 + j) * 8, 560 + sp + 14, 1096); }, 3.4, j % 2 ? C.white : C.c4);
  for (let j = 0; j < 6; j++) key(() => { g.moveTo(560 - sp - 14, 1096); g.quadraticCurveTo(560, 1096 + 27 + j * 9 + Math.sin(q * 2.6 + j) * 8, 560 + sp + 14, 1096); }, .7);
  person(330, 1380, 1.9, C.c2, {obi: C.c4, arm: [22, -40]}); bowlSmall(374, 1300, 1.7);
  person(236, 1330, 1.7, C.c3, {hat: 'bowler', flip: true});
